<title>Differential Equations Study Guide</title>
<style>
:root{--bg:#f1f5f6;--gr:#dde6ea;--cd:#fbfdfd;--tx:#17324d;--mu:#55687b;--ac:#b3261e;--in:#1f5f99;--sf:#e1ecf5;--bd:#c2d0da;--ok:#0b6b45;--no:#8a5300;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1923;--gr:#172533;--cd:#142130;--tx:#e3ecf4;--mu:#93a8bb;--ac:#ff8f86;--in:#7db8f0;--sf:#1d3044;--bd:#2b4257;--ok:#5fd3a0;--no:#f0b35a}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--gr) 1px,transparent 1px),linear-gradient(90deg,var(--gr) 1px,transparent 1px);background-size:26px 26px;color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:880px;margin:0 auto;padding:16px 14px 60px}
h1,h2,.big{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
h1{font-size:1.75rem;line-height:1.2;margin:.5em 0 .3em}
h2{font-size:1.25rem;line-height:1.3;margin:.1em 0 .5em}
.mu{color:var(--mu);font-size:.93rem}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:20px}
.c{background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--in);border-radius:4px;padding:14px 16px;margin:14px 0}
.g .c{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.ch{display:block;width:100%;text-align:left}
.ch:hover{border-left-color:var(--ac)}
.big{display:block;font-size:3.4rem;line-height:1;font-weight:700;color:var(--in);margin-bottom:8px}
.b{background:var(--sf);color:var(--in);border:1px solid var(--bd);border-radius:4px;padding:7px 14px;font-weight:600}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--bd);margin:10px 0 4px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;margin-right:18px;color:var(--mu);font-weight:600;white-space:nowrap}
nav .on{color:var(--tx);border-bottom-color:var(--ac)}
summary{cursor:pointer;font-weight:600}
.c p{margin:.55em 0}
ol,ul{padding-left:1.3em;margin:.3em 0}
.cols{columns:250px;list-style:none;padding:0}
.t{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:3px;background:var(--sf);color:var(--in);margin:2px 4px 2px 0}
.t.ok{color:var(--ok)}.t.no{color:var(--no)}
.a{color:var(--ac)}
.paper{background:#fff;color:#111;border:1px solid #b9b9b9;border-radius:2px;padding:22px 20px;margin:16px 0}
.paper h2{font-size:1.3rem;margin:0 0 4px}
.ln{display:flex;gap:18px;margin:14px 0}
.ln span{flex:1;border-bottom:1px solid #111}
.qq{margin:0 0 30px}
.eq{margin:4px 0}
.sol{display:none;border-top:1px dashed #888;margin-top:10px;padding-top:8px}
.sol.on,.paper.sa .sol{display:block}
.sb{margin-top:8px;font-size:.85rem;padding:5px 12px}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0;font-weight:700}
.paper .a{color:#b3261e}
.fa{border:1.5px solid #111;border-radius:3px;min-height:64px;margin-top:12px;padding:6px 10px;font-weight:700}
.src{display:none;color:#555;font-size:.82rem;margin-top:6px}
.paper.sh .src{display:block}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%;margin:.7em 0!important}
</style>

<script>
const r=String.raw,M=s=>'\\('+s+'\\)';
const L={s:['Solved in the PDF','ok'],e:['Exercise, solution shown in the PDF','ok'],p:['Practice, no solution in the PDF','no'],i:['Stated in an explanation','no']};
const SV='Separation of variables',EX='Separable (the exercise says to use separation of variables)',NS='No solution is given in the PDF.',TY='Not clear from the PDF',SB='Substitution (the exercise says to use an appropriate substitution)';
const INT=[r`\int dx=x+C`,r`\int x^r\,dx=\frac{x^{r+1}}{r+1}+C\ (r\ne-1)`,r`\int\cos x\,dx=\sin x+C`,r`\int\sin x\,dx=-\cos x+C`,r`\int\sec^2x\,dx=\tan x+C`,r`\int\csc^2x\,dx=-\cot x+C`,r`\int\sec x\tan x\,dx=\sec x+C`,r`\int\csc x\cot x\,dx=-\csc x+C`,r`\int e^{x}dx=e^{x}+C`,r`\int b^{x}dx=\frac{b^{x}}{\ln b}+C\ (0\lt b,\ b\ne1)`,r`\int\frac1x\,dx=\ln|x|+C`,r`\int\frac{1}{1+x^2}dx=\tan^{-1}x+C`,r`\int\frac{1}{\sqrt{1-x^2}}dx=\sin^{-1}x+C`,r`\int\frac{1}{x\sqrt{x^2-1}}dx=\sec^{-1}|x|+C`];

const CH=[{
n:1,sec:'2.2',t:'Separable Equations',f:'lec_2_2.pdf',pg:15,
obj:'Objectives (p. 3): define the separable first-order DE, solve separable DEs, solve IVPs with the separable technique.',
note:'Page numbers are PDF page positions. On pages 8 to 11 the printed slide numbers are 9 to 12. The PDF has no Example 1 (its examples start at Example 2).',
terms:[
['First-order equation (order)',
 r`Order = the highest derivative present. Definition 2.2.1 (p. 4) is about <b>first-order</b> equations, where only \(\frac{dy}{dx}\) appears.`,
 r`Find the highest derivative. If it is \(\frac{dy}{dx}\) (a first derivative), the equation is first-order.`,
 'Second-order, third-order and so on: Not clear from the PDF (higher orders are not discussed).',
 r`Every equation in this PDF, e.g. \(\frac{dy}{dx}=-\frac{x}{y}\) (p. 6).`],
['Separable equation',
 r`A first-order DE of the form \(\frac{dy}{dx}=g(x)h(y)\) (Definition 2.2.1, p. 4): the right side is an x-only function times a y-only function.`,
 r`Try to factor the right side \(f(x,y)\) into \(g(x)\cdot h(y)\). Equations written with differentials (Exercise 3: \(dx+e^{3x}dy=0\)) are rearranged until x and y separate (p. 14).`,
 r`<b>Nonseparable</b>: \(f(x,y)\) cannot be factored into \(g(x)h(y)\). A <i>sum</i> such as \(y+\sin x\) does not factor.`,
 r`p. 5: \(\frac{dy}{dx}=y^2xe^{3x+4y}=(xe^{3x})(y^2e^{4y})\) is separable; \(\frac{dy}{dx}=y+\sin x\) is not.`],
['Initial-value problem (IVP)',
 r`A DE plus a condition \(y(x_0)=y_0\) that selects one particular solution.`,
 r`A value such as \(y(4)=-3\), \(y(0)=3\), \(y(0)=\pi\) or \(y(0)=0\) written after the equation.`,
 'With no condition you only find the general solution (a family, Example 4a). With a condition you also find c.',
 'Examples 2, 3, 4(b) and 5 (pp. 6, 7, 9, 10).'],
['General solution and family of solutions',
 r`A solution containing an arbitrary constant \(c\); each value of \(c\) gives a different solution (p. 8).`,
 r`A constant (\(c\), \(C\) or \(c_1\)) is still in the answer and no initial condition was used.`,
 r`<b>Particular solution</b>: the constant has been found from an initial condition (Ex. 4b: \(c=9\)).`,
 r`Example 4(a), p. 8: \(y=\sqrt[3]{x^3+\frac{21}{2}x^2+9x+3c}\).`],
['Explicit and implicit solutions',
 r`<b>Explicit</b>: solved for y, \(y=\) an expression in x. <b>Implicit</b>: x and y stay together in one equation.`,
 'After integrating, try to isolate y. If you can, it is explicit; if not (or you stop), it is implicit.',
 'The PDF labels the answers to Exercises 1, 2, 3 “(explicit)”, Exercise 4 “(implicit)”, and Example 5 “an Implicit Solution”.',
 r`Explicit: Ex. 4(a). Implicit: Example 5, \(\sin y+5e^{y}=3x^3+\cos x+5e^{\pi}-1\) (p. 11).`],
['Linear, homogeneous and other classifications',
 'Not taught in this PDF.','Not clear from the PDF.',
 'Linear equations are the topic of Chapter 2 in this guide (Section 2.3). Homogeneous vs. non-homogeneous: Not clear from the PDF.','None.']
],
meth:[
{n:'Separation of variables',
 rec:r`The equation is \(\frac{dy}{dx}=g(x)h(y)\), or can be rearranged into that shape, e.g. \(\frac{dy}{dx}=-\frac{x}{y}\) becomes \(y\,dy=-x\,dx\) (p. 6).`,
 when:'The right side factors into an x-only part times a y-only part. The PDF states no other condition.',
 fm:r`\[\frac{dy}{dx}=g(x)h(y)\quad\Longrightarrow\quad\int\frac{1}{h(y)}\,dy=\int g(x)\,dx\]<p class="mu">The second form is the pattern used in the examples; the PDF does not write it in general form.</p>`,
 st:[r`Check that the right side factors as \(g(x)h(y)\) (p. 5).`,
  r`Separate: all y-terms with \(dy\) on one side, all x-terms with \(dx\) on the other (Ex. 2: \(y\,dy=-x\,dx\); Ex. 3: divide by \(e^{y}\cos x\)).`,
  r`Simplify before integrating if needed (Ex. 3: termwise division and \(\sin 2x=2\sin x\cos x\)).`,
  'Integrate both sides and add one constant c. Use integration by parts when needed (Ex. 3); formulas are on p. 15.',
  'Solve for y if possible (Ex. 4a gives a cube root); otherwise leave the implicit solution (Ex. 5).',
  'With an initial condition, find c (next method).'],
 exl:'Example 4(a), p. 8',
 ex:r`\[y^2y'=x^2+7x+3\Rightarrow\int y^2dy=\int(x^2+7x+3)\,dx\Rightarrow\frac{y^3}{3}=\frac{x^3}{3}+7\frac{x^2}{2}+3x+c\]\[y=\sqrt[3]{x^3+\tfrac{21}{2}x^2+9x+3c}\]`,
 why:r`The right side \(\frac{x^2+7x+3}{y^2}\) is an x-expression times \(\frac{1}{y^2}\), so the y-part moves left, the x-part moves right, and each side integrates on its own.`,
 mi:[r`\(y+\sin x\) is a sum, not a product, so \(\frac{dy}{dx}=y+\sin x\) is not separable (p. 5).`,
  r`Renaming constants is allowed: Ex. 2 replaces \(2c_1\) by \(c^2\) to reach \(x^2+y^2=c^2\).`,
  'You cannot always isolate y: Ex. 5 stops at an implicit solution.',
  r`Rewrite before integrating: Ex. 3 splits \(\frac{e^{2y}-y}{e^{y}}\) termwise first.`]},
{n:'Solving an initial-value problem by separation',
 rec:r`A separable equation followed by a condition such as \(y(0)=3\).`,
 when:'You need one particular solution instead of the whole family (Objective, p. 3).',
 fm:r`\[y(x_0)=y_0\ \Longrightarrow\ \text{put }x=x_0,\ y=y_0\text{ into the general solution and solve for }c\]`,
 st:['Solve by separation of variables to get the general solution with c.','Substitute the initial values into it.','Solve for c.','Put c back into the general solution.'],
 exl:'Example 4(b), p. 9',
 ex:r`\[3=y(0)=\sqrt[3]{0+3c}=\sqrt[3]{3c}\ \Rightarrow\ c=9\qquad y=\sqrt[3]{x^3+\tfrac{21}{2}x^2+9x+27}\]`,
 why:'The general solution is a family of curves; the condition picks the one through the given point (Ex. 2: the circle through (4, −3) has radius 5).',
 mi:[r`Ex. 5: substituting \(y=\pi,\ x=0\) gives \(c=5e^{\pi}-1\), and the answer stays implicit.`,
  r`Ex. 3: \(y=0\) when \(x=0\) gives \(c=4\) in the implicit relation.`]}
],
ref:'<details class="c"><summary>Reference: integration formulas from the table on p. 15</summary><ul class="cols">'+INT.map(s=>'<li>'+M(s)+'</li>').join('')+'</ul></details>',
qs:[
['Classification example (a)','5',r`\(\dfrac{dy}{dx}=y^2xe^{3x+4y}\)`,'Separable (stated in the PDF)','Factor \(f(x,y)\) as \(g(x)h(y)\)','i',
 r`PDF: separable. \(y^2xe^{3x+4y}=(xe^{3x})(y^2e^{4y})\) with \(g(x)=xe^{3x}\) and \(h(y)=y^2e^{4y}\). It is not solved further.`],
['Classification example (b)','5',r`\(\dfrac{dy}{dx}=y+\sin x\)`,'Nonseparable (stated in the PDF)','None: it cannot be separated','i',
 r`PDF: nonseparable, because \(y+\sin x\) cannot be factored as \(g(x)\cdot h(y)\).`],
['Example 2: Solution Curve','6',r`Solve the initial-value problem \(\dfrac{dy}{dx}=-\dfrac{x}{y},\ y(4)=-3\).`,'Separable, IVP',SV+', then the initial condition','s',
 r`Rewrite as \(y\,dy=-x\,dx\):\[\int y\,dy=-\int x\,dx\quad\text{and}\quad\frac{y^2}{2}=-\frac{x^2}{2}+c_1\]Replace \(2c_1\) by \(c^2\): \(x^2+y^2=c^2\), a family of concentric circles centred at the origin. With \(x=4,\ y=-3\): \(16+9=25=c^2\).<br><b class="a">Answer:</b> \(x^2+y^2=25\), a circle of radius 5.`],
['Example 3: An Initial-Value Problem','7',r`Solve \((e^{2y}-y)\cos x\,\dfrac{dy}{dx}=e^{y}\sin 2x,\ y(0)=0\).`,'Separable, IVP',SV+' (integration by parts), then the initial condition','s',
 r`Divide by \(e^{y}\cos x\):\[\frac{e^{2y}-y}{e^{y}}\,dy=\frac{\sin 2x}{\cos x}\,dx\]Use termwise division on the left and \(\sin2x=2\sin x\cos x\) on the right, then integrate (by parts on the left):\[\int(e^{y}-ye^{-y})\,dy=2\int\sin x\,dx\ \Rightarrow\ e^{y}+ye^{-y}+e^{-y}=-2\cos x+c\]\(y=0\) when \(x=0\) gives \(c=4\).<br><b class="a">Answer:</b> \(e^{y}+ye^{-y}+e^{-y}=4-2\cos x\)`],
['Example 4(a): a family of solutions','8 (slide 9)',r`Solving a separable equation: \(y'=\dfrac{x^2+7x+3}{y^2}\).`,'Separable',SV,'s',
 r`\[y^2y'=x^2+7x+3\ \Rightarrow\ \int y^2\,dy=\int(x^2+7x+3)\,dx\ \Rightarrow\ \frac{y^3}{3}=\frac{x^3}{3}+7\frac{x^2}{2}+3x+c\]<b class="a">Answer:</b> \(y=\sqrt[3]{x^3+\tfrac{21}{2}x^2+9x+3c}\). This is a family of solutions: each value of \(c\) gives a different solution (the PDF plots several).`],
['Example 4(b): Solving an initial value problem','9 (slide 10)',r`\(y'=\dfrac{x^2+7x+3}{y^2},\ y(0)=3\)`,'Separable, IVP',SV+', then the initial condition','s',
 r`General solution from 4(a): \(y=\sqrt[3]{x^3+\tfrac{21}{2}x^2+9x+3c}\). From the initial condition:\[3=y(0)=\sqrt[3]{0+3c}=\sqrt[3]{3c}\ \Rightarrow\ c=9\]<b class="a">Answer:</b> \(y=\sqrt[3]{x^3+\tfrac{21}{2}x^2+9x+27}\)`],
['Example 5: an implicit solution','10–11 (slides 11–12)',r`Solving an initial value problem: \(y'=\dfrac{9x^2-\sin x}{\cos y+5e^{y}},\ y(0)=\pi\).`,'Separable, IVP',SV+', then the initial condition','s',
 r`\[(\cos y+5e^{y})\,y'(x)=9x^2-\sin x\ \Rightarrow\ \int(\cos y+5e^{y})\,y'(x)\,dx=\int(9x^2-\sin x)\,dx\]\[\sin y+5e^{y}=3x^3+\cos x+c\]Initial condition: \(\sin\pi+5e^{\pi}=0+\cos0+c\ \Rightarrow\ 5e^{\pi}-1=c\).<br><b class="a">Answer (implicit, p. 11):</b> \(\sin y+5e^{y}=3x^3+\cos x+5e^{\pi}-1\). The PDF also plots the family and this solution.`],
['Exercise 1','12 (solution on p. 13)',r`\(\dfrac{dy}{dx}=\sin 5x\)`,EX,SV,'e',
 r`\(dy=\sin(5x)\,dx\ \Rightarrow\ \int dy=\int\sin(5x)\,dx\)<br><b class="a">Answer:</b> \(y=-\tfrac15\cos(5x)+C\) (explicit)`],
['Exercise 2','12 (solution on p. 13)',r`\(\dfrac{dy}{dx}=(x+1)^2\)`,EX,SV,'e',
 r`\(dy=(x+1)^2\,dx\ \Rightarrow\ \int dy=\int(x+1)^2\,dx\)<br><b class="a">Answer:</b> \(y=\dfrac{(x+1)^3}{3}+C\) (explicit)`],
['Exercise 3','12 (solution on p. 14)',r`\(dx+e^{3x}dy=0\)`,EX,SV,'e',
 r`\(e^{3x}dy=-dx\ \Rightarrow\ dy=-e^{-3x}dx\ \Rightarrow\ \int dy=\int-e^{-3x}dx\)<br><b class="a">Answer:</b> \(y=\dfrac{e^{-3x}}{3}+C\) (explicit)`],
['Exercise 4','12 (solution on p. 14)',r`\(dy-(y-1)^2dx=0\)`,EX,SV,'e',
 r`\(dy=(y-1)^2dx\ \Rightarrow\ \dfrac{1}{(y-1)^2}dy=dx\ \Rightarrow\ \displaystyle\int\dfrac{1}{(y-1)^2}dy=\int dx\)\[\frac{(y-1)^{-2+1}}{-2+1}=x+C\]<b class="a">Answer:</b> \((y-1)^{-1}=-x+C_1\) (implicit). The slide prints a stray “d” after the right-hand integral.`],
['Exercise 5','12',r`\(x\dfrac{dy}{dx}=4y\)`,EX,SV,'p',NS],
['Exercise 6','12',r`\(\dfrac{dy}{dx}+2xy^2=0\)`,EX,SV,'p',NS],
['Exercise 7','12',r`\(\dfrac{dy}{dx}=e^{3x+2y}\)`,EX,SV,'p',NS],
['Exercise 8','12',r`\(e^{x}y\dfrac{dy}{dx}=e^{-y}+e^{-2x-y}\)`,EX,SV,'p',NS]
]},
{
n:2,sec:'2.3',t:'Linear Equations',f:'lec_2_3.pdf',pg:14,
obj:'Objectives (p. 3): rewrite first-order linear equations in standard form; solve them with the integrating-factor method.',
note:'Page numbers are PDF page positions and match the printed slide numbers. This PDF has no practice exercises.',
terms:[
['First-order equation (order)',
 r`Order = the highest derivative present. Definition 2.3.1 (p. 5) covers <b>first-order</b> equations: only \(\frac{dy}{dx}\) appears.`,
 r`Find the highest derivative; if it is \(\frac{dy}{dx}\) (or \(y'\)), the equation is first-order.`,
 'Higher-order linear equations are only mentioned in the introduction (p. 4). How to solve them: Not clear from the PDF.',
 'All examples, pp. 8–14.'],
['Linear equation (in y)',
 r`A first-order DE of the form \(a_1(x)\dfrac{dy}{dx}+a_0(x)y=g(x)\) (Definition 2.3.1, p. 5).`,
 r`Can you arrange it so \(\frac{dy}{dx}\) has a coefficient \(a_1(x)\), \(y\) has a coefficient \(a_0(x)\), and the rest is a function \(g(x)\)? The coefficients depend on \(x\) only.`,
 'Nonlinear: not defined in this PDF (p. 4 refers to Section 1.1, items (6) and (7)). Not clear from the PDF.',
 r`\(\frac{dy}{dx}-3y=0\) (p. 8); \(x\frac{dy}{dx}-4y=x^6e^{x}\) (p. 10).`],
['Standard form',
 r`\(\dfrac{dy}{dx}+P(x)y=f(x)\), obtained by dividing (1) by the lead coefficient \(a_1(x)\) (p. 5, equation (2)).`,
 r`The coefficient of \(\frac{dy}{dx}\) must be exactly 1. Then \(P(x)\) is the coefficient of \(y\) and \(f(x)\) is the right side.`,
 r`Not yet standard: \(x\frac{dy}{dx}-4y=x^6e^{x}\) (divide by \(x\), p. 10); \((x^2-9)\frac{dy}{dx}+xy=0\) (divide by \(x^2-9\), p. 11); \(\sin x\,y'-1=-\cos x\,y\) (divide by \(\sin x\) and re-order, p. 14).`,
 r`Already standard: \(\frac{dy}{dx}-3y=6\) with \(P=-3\) (p. 9); \(\frac{dy}{dx}+y=x\) with \(P=1\) (p. 12).`],
['Linear and separable together',
 'Some linear equations can also be solved by separation of variables (p. 6). Being linear and being separable are two separate checks.',
 r`Linear: fits form (1). Separable: the right side factors as \(g(x)h(y)\) (Chapter 1).`,
 r`Both: \(\frac{dy}{dx}+2xy=0\) and \(\frac{dy}{dx}=y+5\). Linear but not separable: \(\frac{dy}{dx}+y=x\).`,
 'p. 6; Example 1 (p. 8) notes it can be separated, then uses the integrating factor.'],
['Integrating factor',
 r`The function \(e^{\int P(x)dx}\), built from the standard form. Multiplying by it makes the left side the derivative \(\frac{d}{dx}\left[e^{\int P(x)dx}y\right]\) (p. 7). Written \(\eta(x)\) in Ex. 6–7.`,
 'After standard form, take P(x), integrate it (no constant is needed) and put the result in the exponent.',
 'It is a multiplier used part-way through, not the solution itself.',
 r`\(e^{-3x}\) (Ex. 1–2), \(x^{-4}\) (Ex. 3), \(\sqrt{x^2-9}\) (Ex. 4), \(e^{x}\) (Ex. 5), \(x\) (Ex. 6), \(\sin x\) (Ex. 7).`],
['General solution and initial-value problem',
 r`A general solution contains a constant \(c\) (Ex. 3, 4). An IVP adds a condition \(y(x_0)=y_0\) that fixes \(c\) (Ex. 5).`,
 'A condition such as y(0) = 4 written after the equation.',
 r`Ex. 5: general solution \(y=x-1+ce^{-x}\); the condition gives \(c=5\).`,
 'Ex. 3 and 4 (general), Ex. 5 (IVP).'],
['Homogeneous and non-homogeneous',
 'Not clear from the PDF. These words are not used.',
 'The PDF gives no definition. Observation only: the right side is 0 in Ex. 1 and Ex. 4 and non-zero in Ex. 2, 3, 5, 6, 7; the PDF gives this no name.',
 'Not clear from the PDF.','None.']
],
meth:[
{n:'Integrating-factor method (linear first-order equations)',
 rec:r`The equation fits \(a_1(x)\frac{dy}{dx}+a_0(x)y=g(x)\) (Definition 2.3.1), so after dividing by \(a_1(x)\) it reads \(\frac{dy}{dx}+P(x)y=f(x)\).`,
 when:'The equation is linear in y. In Ex. 3 to 5 the PDF also notes where P and f are continuous and gives the solution on that interval.',
 fm:r`\[\frac{dy}{dx}+P(x)y=f(x)\qquad e^{\int P(x)\,dx}\ \ (\text{written }\eta(x)\text{ in Ex. 6–7})\]\[\frac{d}{dx}\!\left[e^{\int P(x)dx}\,y\right]=e^{\int P(x)dx}f(x)\]<p class="mu">Ex. 6–7 finish with \(y=\frac{1}{\eta(x)}\int\eta(x)f(x)\,dx\); the PDF does not state this in general form.</p>`,
 st:['Put the equation in standard form (2): divide by the lead coefficient.',
  r`Identify \(P(x)\) and \(f(x)\). Compute the integrating factor \(e^{\int P(x)dx}\); no constant is needed in \(\int P(x)dx\).`,
  r`Multiply both sides of the standard form by the integrating factor. The left side is automatically \(\frac{d}{dx}\left[e^{\int P(x)dx}y\right]\).`,
  'Integrate both sides (add c) and solve for y.',
  'State the interval where P and f are continuous (Ex. 3 to 5).'],
 exl:r`Example 3, p. 10: \(x\frac{dy}{dx}-4y=x^6e^{x}\)`,
 ex:r`\[\tfrac{dy}{dx}-\tfrac{4}{x}y=x^5e^{x}\ \Rightarrow\ e^{-4\int dx/x}=e^{-4\ln x}=x^{-4}\ \Rightarrow\ \tfrac{d}{dx}[x^{-4}y]=xe^{x}\]\[x^{-4}y=xe^{x}-e^{x}+c\ \Rightarrow\ y=x^5e^{x}-x^4e^{x}+cx^4\quad\text{on }(0,\infty)\]`,
 why:r`The equation matches form (1) with \(a_1=x\), \(a_0=-4\), \(g=x^6e^{x}\), so it is linear. Dividing by \(x\) gives standard form, and the integrating factor turns the left side into one derivative that can be integrated directly.`,
 mi:[r`Standard form first (“Remember…”, p. 7). Ex. 3 needs \(P=-4/x\), not \(-4\); reading P before dividing gives the wrong factor.`,
  r`Some equations also need re-ordering: Ex. 7, \(\sin x\,y'-1=-\cos x\,y\).`,
  r`No constant in \(\int P(x)dx\); the constant c appears when you integrate in step 4.`,
  'Multiply the whole equation, including the right side (Ex. 2 gives 6e^(−3x)).',
  r`Check where P and f are continuous: Ex. 4 is solved only for \(x>3\) or \(x<-3\).`,
  r`Ex. 3 uses \(\ln x\) instead of \(\ln|x|\) because \(x>0\); Ex. 4 keeps \(\ln|x^2-9|\).`]},
{n:'Separation of variables (when the linear equation is also separable)',
 rec:r`A linear equation whose right side factors as \(g(x)h(y)\), e.g. \(\frac{dy}{dx}+2xy=0\) or \(\frac{dy}{dx}=y+5\) (p. 6).`,
 when:r`Only if it is separable. \(\frac{dy}{dx}+y=x\) is linear but not separable (p. 6).`,
 fm:r`\[\frac{dy}{dx}=g(x)h(y)\]<p class="mu">Full method: Chapter 1.</p>`,
 st:['Separate the variables and integrate both sides (Chapter 1).','Solve for y.'],
 exl:'Example 1, p. 8',
 ex:r`\(\frac{dy}{dx}-3y=0\): the PDF says it can be solved by separation of variables and instead uses the integrating factor \(e^{-3x}\), giving \(y=ce^{3x}\).`,
 why:'The PDF names this as an alternative for Example 1. The integrating-factor method is the general procedure for equations in standard form.',
 mi:['Do not assume every linear equation is separable (p. 6).']},
{n:'Solving an initial-value problem with the integrating factor',
 rec:r`A linear equation followed by a condition such as \(y(0)=4\).`,
 when:'You need one particular solution (Ex. 5).',
 fm:r`\[y(x_0)=y_0\ \Longrightarrow\ \text{substitute into the general solution and solve for }c\]`,
 st:['Find the general solution with c.','Substitute the initial values into the general solution.','Solve for c and write the final solution with its interval.'],
 exl:'Example 5, p. 12',
 ex:r`\[y=x-1+ce^{-x},\ y(0)=4\ \Rightarrow\ c=5\ \Rightarrow\ y=x-1+5e^{-x},\ -\infty\lt x\lt\infty\]`,
 why:'The condition picks one curve from the family of solutions.',
 mi:['Ex. 5 substitutes into the general solution, after solving for y.']}
],
qs:[
['Classification check (a)','6',r`\(\dfrac{dy}{dx}+2xy=0\)`,'Linear and separable (stated in the PDF)','Not solved here','i','PDF: linear and separable. The PDF asks you to verify this and does not show the check.'],
['Classification check (b)','6',r`\(\dfrac{dy}{dx}=y+5\)`,'Linear and separable (stated in the PDF)','Not solved here','i','PDF: linear and separable. The check is not shown.'],
['Classification check (c)','6',r`\(\dfrac{dy}{dx}+y=x\)`,'Linear, not separable (stated in the PDF)','Not solved here (Example 5 solves it with an initial condition)','i','PDF: linear but not separable.'],
['Example 1: Solving a Linear Equation','8',r`Solve \(\dfrac{dy}{dx}-3y=0\).`,'First-order linear, already in standard form','Integrating factor (the PDF notes separation also works)','s',
 r`\(P(x)=-3\), so the integrating factor is \(e^{\int(-3)dx}=e^{-3x}\).\[e^{-3x}\tfrac{dy}{dx}-3e^{-3x}y=e^{-3x}\cdot0\ \Longleftrightarrow\ \tfrac{d}{dx}\left[e^{-3x}y\right]=0\ \Rightarrow\ e^{-3x}y=c\]<b class="a">Answer:</b> \(y=ce^{3x},\ -\infty\lt x\lt\infty\)`],
['Example 2: Solving a Linear Equation','9',r`Solve \(\dfrac{dy}{dx}-3y=6\).`,'First-order linear, already in standard form','Integrating factor','s',
 r`\(P(x)=-3\); integrating factor \(e^{-3x}\).\[e^{-3x}\tfrac{dy}{dx}-3e^{-3x}y=6e^{-3x}\ \Rightarrow\ \tfrac{d}{dx}[e^{-3x}y]=6e^{-3x}\]\[\int\tfrac{d}{dx}[e^{-3x}y]\,dx=6\int e^{-3x}dx\ \Rightarrow\ e^{-3x}y=-6\left(\tfrac{e^{-3x}}{3}\right)+c\]<b class="a">Answer:</b> \(y=-2+ce^{3x},\ -\infty\lt x\lt\infty\)`],
['Example 3: General Solution','10',r`Solve \(x\dfrac{dy}{dx}-4y=x^6e^{x}\).`,'First-order linear; divide by x to reach standard form','Integrating factor','s',
 r`Standard form (6): \(\frac{dy}{dx}-\frac{4}{x}y=x^5e^{x}\), so \(P(x)=-4/x\) and \(f(x)=x^5e^{x}\), both continuous on \((0,\infty)\). Integrating factor (\(\ln x\) instead of \(\ln|x|\) since \(x>0\)):\[e^{-4\int dx/x}=e^{-4\ln x}=e^{\ln x^{-4}}=x^{-4}\]Multiply (6) by \(x^{-4}\): \(x^{-4}\frac{dy}{dx}-4x^{-5}y=xe^{x}\), i.e. \(\frac{d}{dx}[x^{-4}y]=xe^{x}\). Integration by parts gives \(x^{-4}y=xe^{x}-e^{x}+c\).<br><b class="a">Answer:</b> \(y=x^5e^{x}-x^4e^{x}+cx^4\) on \((0,\infty)\)`],
['Example 4: General Solution','11',r`Find the general solution of \((x^2-9)\dfrac{dy}{dx}+xy=0\).`,'First-order linear; divide by \(x^2-9\) to reach standard form','Integrating factor','s',
 r`Standard form (7): \(\frac{dy}{dx}+\frac{x}{x^2-9}y=0\), \(P(x)=\frac{x}{x^2-9}\), continuous on \((-\infty,-3)\), \((-3,3)\), \((3,\infty)\). The PDF solves on the first and third intervals. Integrating factor:\[e^{\int x\,dx/(x^2-9)}=e^{\frac12\int 2x\,dx/(x^2-9)}=e^{\frac12\ln|x^2-9|}=\sqrt{x^2-9}\]Then \(\frac{d}{dx}\left[\sqrt{x^2-9}\,y\right]=0\), so \(\sqrt{x^2-9}\,y=c\).<br><b class="a">Answer:</b> for \(x>3\) or \(x<-3\): \(y=\dfrac{c}{\sqrt{x^2-9}}\)`],
['Example 5: An Initial-Value Problem','12',r`Solve \(\dfrac{dy}{dx}+y=x,\ y(0)=4\).`,'First-order linear, standard form, IVP','Integrating factor, then the initial condition','s',
 r`\(P(x)=1\) and \(f(x)=x\) are continuous on \((-\infty,\infty)\). Integrating factor \(e^{\int dx}=e^{x}\):\[\tfrac{d}{dx}[e^{x}y]=xe^{x}\ \Rightarrow\ e^{x}y=xe^{x}-e^{x}+c\ \Rightarrow\ y=x-1+ce^{-x}\]\(y=4\) when \(x=0\) gives \(c=5\).<br><b class="a">Answer (8):</b> \(y=x-1+5e^{-x},\ -\infty\lt x\lt\infty\)`],
['Example 6: Solve the Linear ODE','13',r`Solve \(y'+\dfrac{1}{x}y=4x^2,\ x>0\).`,'First-order linear, already in standard form','Integrating factor (called \(\eta(x)\))','s',
 r`\(P(x)=\frac1x\), \(f(x)=4x^2\). Integrating factor: \(\eta(x)=e^{\int P(x)dx}=e^{\int\frac1x dx}=e^{\ln x}=x\).\[y=\frac1x\int x\cdot4x^2\,dx=\frac1x\int4x^3dx=\frac1x\left(x^4+c\right)\]<b class="a">Answer:</b> \(y=x^3+\dfrac{c}{x}\)`],
['Example 7: Solve the Linear ODE','14',r`Solve \(\sin x\;y'-1=-\cos x\;y\).`,'First-order linear; not in standard form (divide by \(\sin x\) and re-order)','Integrating factor (called \(\eta(x)\))','s',
 r`Divide by \(\sin x\) and re-order: \(y'+\frac{\cos x}{\sin x}y=\frac{1}{\sin x}\), so \(P(x)=\cot x\) and \(f(x)=\frac{1}{\sin x}\). Integrating factor: \(\eta(x)=e^{\int\cot x\,dx}=e^{\ln(\sin x)}=\sin x\).\[y=\frac{1}{\sin x}\int\sin x\cdot\frac{1}{\sin x}\,dx=\frac{1}{\sin x}\left[x+C\right]\]<b class="a">Answer:</b> \(y=\dfrac{x}{\sin x}+\dfrac{C}{\sin x}\). The PDF states no interval for this example.`]
]},{
n:3,sec:'2.4',t:'Exact Equations',f:'Lecture_2_4.pdf',pg:33,
obj:'Objectives (p. 3): determine whether an ODE is exact; solve exact equations.',
note:'Page numbers are PDF page positions; printed slide numbers are shown where they differ. Pages 14–15, 18, 21, 25 and 28–33 are handwritten work or photos.',
terms:[
['Differential form M dx + N dy = 0',
 r`A first-order equation written as \(M(x,y)\,dx+N(x,y)\,dy=0\) (pp. 4, 6).`,
 'Move everything to one side so the right side is 0, then read M (it multiplies dx) and N (it multiplies dy). Example 4 does this to x(1 − sin y)dy = (cos x − cos y − y)dx.',
 r`Chapter 1 equations look like \(\frac{dy}{dx}=g(x)h(y)\). Note \(y\,dx+x\,dy=0\) is separable and also exact (p. 4).`,
 r`\((2x-1)dx+(3y+7)dy=0\): \(M=2x-1\), \(N=3y+7\) (p. 7).`,
 'M is whatever multiplies dx and N is whatever multiplies dy, once the right side is 0.'],
['Differential of a function of two variables',
 r`If \(z=f(x,y)\) has continuous first partial derivatives, \(dz=\frac{\partial f}{\partial x}dx+\frac{\partial f}{\partial y}dy\) (p. 5, eq. (1)). When \(f(x,y)=c\) this gives \(\frac{\partial f}{\partial x}dx+\frac{\partial f}{\partial y}dy=0\) (eq. (2)).`,
 'Ask whether the left side of your equation is exactly what differentiating some f(x,y) would give.',
 'Not every M dx + N dy is the differential of some f; the test below decides.',
 r`\(d(xy)=y\,dx+x\,dy\) (p. 4).`,
 'Think of f(x,y) = c as the answer you want. Differentiating it gives an equation of the form M dx + N dy = 0. An exact equation is one where you can run this backwards.'],
['Exact equation',
 r`\(M\,dx+N\,dy=0\) is exact if its left side is the differential of some function \(f(x,y)\) in a region R (Definition 2.4.1, p. 6).`,
 r`Run the test \(\frac{\partial M}{\partial y}=\frac{\partial N}{\partial x}\) (next card).`,
 'Not exact: the test fails, as in Example 1(b).',
 'Exact: Example 1 (a), (c), (d). Not exact: Example 1(b) (pp. 7–10).',
 'Exact means a hidden function f(x,y) exists. If it does, you can find it, and the answer is f(x,y) = c.'],
['Test for exactness (Theorem 2.4.1)',
 r`If M and N are continuous with continuous first partial derivatives in a rectangle R (\(a<x<b,\ c<y<d\); the signs are not visible in the PDF), then \(M\,dx+N\,dy\) is exact exactly when \(\frac{\partial M}{\partial y}=\frac{\partial N}{\partial x}\) (p. 6, eq. (4)).`,
 'Differentiate M with respect to y and N with respect to x, then compare. The handwritten note on p. 5 says the same in words.',
 'Equal means exact. Different means not exact.',
 r`Example 1(d): \(2y=2y\) (p. 10). Example 1(b): \(1\neq-1\) (p. 8).`,
 'Take the y-derivative of the dx part and the x-derivative of the dy part. If they match, it is exact.'],
['Implicit solution f(x,y) = c',
 r`The solution of an exact equation is left as \(f(x,y)=c\) (p. 11, step 8).`,
 'The answer has x and y together with a constant c.',
 r`Example 2 also gives the explicit form \(y=\frac{c}{1-x^2}\). Example 5 (an IVP) fixes \(c=18\).`,
 r`Example 3: \(xy^2-x^2+y=c\) (p. 17).`,
 'You do not have to solve for y. Each value of c gives a different curve f(x,y) = c.'],
['Other classifications (linear, homogeneous)',
 'Not clear from the PDF. The objective on p. 3 mentions “first-order linear exact equations” without explaining the phrase.',
 'Not clear from the PDF.',
 'The only link given: y dx + x dy = 0 is separable and also exact (p. 4).',
 'None.',
 'Skip these words here; exactness is its own check.']
],
meth:[
{n:'Test for exactness',
 rec:r`The equation is, or can be written as, \(M\,dx+N\,dy=0\).`,
 when:'Always first, before trying to solve (p. 11 and step 2 on p. 26).',
 fm:r`\[\frac{\partial M}{\partial y}=\frac{\partial N}{\partial x}\]`,
 st:['Write the equation as M dx + N dy = 0.','Find ∂M/∂y and ∂N/∂x.','Equal: exact, go on to solve. Not equal: not exact (Example 1(b)).'],
 exl:'Example 1(c), p. 9',
 ex:r`\[M=\sin y-y\sin x,\ N=\cos x+x\cos y-y\]\[\frac{\partial M}{\partial y}=\cos y-\sin x,\qquad\frac{\partial N}{\partial x}=-\sin x+\cos y\]`,
 why:'Only exact equations have a function f with ∂f/∂x = M and ∂f/∂y = N, so the test tells you whether the solving method can work.',
 mi:[r`Move everything to one side first: Example 4 gives \(M=-\cos x+\cos y+y\), not \(\cos x-\cos y-y\).`,'Example 1(b) is written with a minus sign, so N = −x − 6y.','If the test fails, stop: Example 1(b) is not exact.'],
 z:'Differentiate M with respect to y and N with respect to x. The same answer means exact.'},
{n:'Solving an exact equation (partial integration)',
 rec:'An equation that passed the exactness test.',
 when:'Only when ∂M/∂y = ∂N/∂x. The PDF says none of these formulas should be memorized (p. 12).',
 fm:r`\[f(x,y)=\int M\,dx+g(y),\qquad g'(y)=N-\frac{\partial}{\partial y}\int M\,dx,\qquad f(x,y)=c\]`,
 st:['Write the equation as M dx + N dy = 0.','Check ∂M/∂y = ∂N/∂x.',r`Integrate M with respect to x; the constant is a function \(g(y)\).`,'Differentiate the result with respect to y.',r`Set it equal to N and solve for \(g'(y)\).`,r`Integrate \(g'(y)\) to get \(g(y)\).`,'Substitute g(y) into the result of step 3.',r`Write the implicit solution \(f(x,y)=c\). With an initial condition, find c (Example 5).`],
 exl:'Example 3, pp. 16–17',
 ex:r`\[f=\int(y^2-2x)dx=xy^2-x^2+g(y)\ \Rightarrow\ 2xy+g'(y)=2xy+1\ \Rightarrow\ g(y)=y\]\[xy^2-x^2+y=c\]`,
 why:'Exactness says ∂f/∂x = M, so integrating M with respect to x rebuilds f except for a function of y; matching ∂f/∂y with N finds that function.',
 mi:['The constant in step 3 is a function g(y), not a plain number.','p. 12 shows the expression for g′(y) does not depend on x.','p. 12 also shows you may start from ∂f/∂y = N instead: f = ∫N dy + h(x).'],
 z:'Rebuild the hidden function: integrate M by x, add an unknown g(y), then use N to find g(y). The answer is f(x,y) = c.'},
{n:'Shortcut: integrate M and N, combine without repeats',
 rec:'An exact equation (after the test passes).',
 when:'Handwritten shortcut on pp. 32–33; the photos on pp. 21 and 25 carry handwritten “short solution” notes.',
 fm:r`\[f(x,y)=\int M\,dx+\int N\,dy\quad(\text{a term found in both is written once})\]`,
 st:['Check exactness.','Compute ∫M dx.','Compute ∫N dy.','Add them, writing any repeated term once.','The solution is f(x,y) = c (step 8, p. 26).'],
 exl:r`Exercise 1, p. 33: \((5x+4y)dx+(4x-8y^3)dy=0\)`,
 ex:r`\[\int M\,dx=\tfrac{5x^2}{2}+4xy,\quad\int N\,dy=4xy-2y^4\ \Rightarrow\ f=\tfrac{5x^2}{2}+4xy-2y^4\]`,
 why:'Exercise 1 is solved both ways (pp. 29–33) and gives the same f.',
 mi:['Write a shared term such as 4xy only once (“without repeating”).','Use it only after the exactness check.'],
 z:'Integrate M by x, integrate N by y, and merge the two results, keeping each term once.'}
],
qs:[
['Introduction example','4',r`\(y\,dx+x\,dy=0\)`,'Separable and exact (stated in the PDF)','Recognize the left side as \(d(xy)\)','i',
 r`PDF: the equation is separable, but it can also be solved by noticing that the left side is the differential of \(f(x,y)=xy\), \(d(xy)=y\,dx+x\,dy\). It is not solved further.`,
 'Spot that the left side is exactly the differential of xy. That is the idea behind this whole section.'],
['Example 1(a)','7',r`Determine whether it is exact: \((2x-1)dx+(3y+7)dy=0\)`,'Differential form','Exactness test (Theorem 2.4.1)','s',
 r`\(M=2x-1,\ N=3y+7\):\[\frac{\partial M}{\partial y}=0-0=0,\qquad\frac{\partial N}{\partial x}=0+0=0\]<b class="a">Answer:</b> the two are equal, so the ODE is exact.`,
 'M has no y and N has no x, so both derivatives are 0 and they match.'],
['Example 1(b)','8',r`Determine whether it is exact: \((2x+y)dx-(x+6y)dy=0\)`,'Differential form','Exactness test','s',
 r`\(M=2x+y,\ N=-x-6y\):\[\frac{\partial M}{\partial y}=0+1=1,\qquad\frac{\partial N}{\partial x}=-1-0=-1\]<b class="a">Answer:</b> \(1\neq-1\), so the ODE is not exact.`,
 'The two derivatives are 1 and −1. They differ, so the test fails.'],
['Example 1(c)','9',r`Determine whether it is exact: \((\sin y-y\sin x)dx+(\cos x+x\cos y-y)dy=0\)`,'Differential form','Exactness test','s',
 r`\[\frac{\partial M}{\partial y}=\cos y-\sin x,\qquad\frac{\partial N}{\partial x}=-\sin x+\cos y\]<b class="a">Answer:</b> equal, so the ODE is exact.`,
 'Both derivatives come out as cos y − sin x, so it passes.'],
['Example 1(d)','10',r`Determine whether it is exact: \((y^2-2x)dx+(2xy+1)dy=0\)`,'Differential form','Exactness test','s',
 r`\(M=y^2-2x,\ N=2xy+1\):\[\frac{\partial M}{\partial y}=2y,\qquad\frac{\partial N}{\partial x}=2y\]<b class="a">Answer:</b> equal, so the ODE is exact.`,
 'Both derivatives are 2y, so it passes.'],
['Example 2: Solving an Exact DE','13 (handwritten steps pp. 13–15)',r`Solve \(2xy\,dx+(x^2-1)\,dy=0\).`,'Exact','Exactness test, then partial integration','s',
 r`\(M=2xy,\ N=x^2-1\): \(\frac{\partial M}{\partial y}=2x=\frac{\partial N}{\partial x}\), so it is exact and \(\frac{\partial f}{\partial x}=2xy\), \(\frac{\partial f}{\partial y}=x^2-1\). Integrating the first: \(f=x^2y+g(y)\). Then \(\frac{\partial f}{\partial y}=x^2+g'(y)=x^2-1\), so \(g'(y)=-1\), \(g(y)=-y\), and \(f=x^2y-y\).<br><b class="a">Answer:</b> \(x^2y-y=c\) (implicit). Explicit form: \(y=\frac{c}{1-x^2}\), defined on any interval not containing \(x=1\) or \(x=-1\). The handwritten steps (pp. 13–15) follow the same route and end with \(f(x,y)=yx^2-y\).`,
 r`Integrate \(2xy\) by x to get \(x^2y\) plus an unknown \(g(y)\); matching with \(x^2-1\) shows \(g(y)=-y\).`],
['Example 3: Solving an Exact DE','16–17 (slides 14–15; photo p. 18)',r`Solve the exact differential equation of Example 1(d): \((y^2-2x)dx+(2xy+1)dy=0\).`,'Exact','Partial integration','s',
 r`\(f=\int(y^2-2x)dx=y^2x-x^2+g(y)\). Then \(\frac{\partial f}{\partial y}=2xy+g'(y)\). Setting it equal to \(N\): \(2xy+1=2xy+g'(y)\), so \(g'(y)=1\) and \(g(y)=y\). Hence \(f(x,y)=xy^2-x^2+y\).<br><b class="a">Answer:</b> \(xy^2-x^2+y=c\)`,
 'Integrating M leaves everything except a y-only piece. Matching with N shows the missing piece is y.'],
['Example 4: Solving an Exact DE','19–20 (slides 16–17; photo p. 21)',r`Determine whether the equation is exact. If it is exact, solve it: \(x(1-\sin y)\,dy=(\cos x-\cos y-y)\,dx\)`,'Exact (after moving terms to one side)','Exactness test, then partial integration','s',
 r`Moving terms: \(M=-\cos x+\cos y+y\), \(N=x-x\sin y\). \(\frac{\partial M}{\partial y}=1-\sin y=\frac{\partial N}{\partial x}\), so it is exact. \(f=\int(-\cos x+\cos y+y)dx=-\sin x+x\cos y+xy+g(y)\), so \(\frac{\partial f}{\partial y}=-x\sin y+x+g'(y)\). Setting it equal to \(N\): \(g'(y)=0\), so \(g(y)\) is a constant.<br><b class="a">Answer:</b> a family of solutions is \(-\sin x+x\cos y+xy=c\). The photo (p. 21) also shows a shorter version.`,
 'Move everything to one side to find M and N, then use the same routine: integrate M by x and fix the y-part with N.'],
['Example 5: Solving an IVP','22–24 (slides 18–20; photo p. 25)',r`Solve the IVP \((3x^2y-1)dx+(x^3+6y-y^2)dy=0,\ y(0)=3\).`,'Exact, IVP','Exactness test, partial integration, initial condition','s',
 r`\(\frac{\partial M}{\partial y}=3x^2=\frac{\partial N}{\partial x}\), so it is exact. \(f=\int(3x^2y-1)dx=x^3y-x+g(y)\), \(\frac{\partial f}{\partial y}=x^3+g'(y)\). Setting it equal to \(N\): \(g'(y)=6y-y^2\), so \(g(y)=3y^2-\tfrac13y^3\) and \(f=x^3y-x+3y^2-\tfrac13y^3=C\). With \(y(0)=3\): \(0-0+3(3)^2-\tfrac13(3)^3=C\), so \(C=18\).<br><b class="a">Answer:</b> \(x^3y-x+3y^2-\tfrac13y^3=18\)`,
 'Solve the exact equation to get f = C, then put in x = 0 and y = 3 to fix C = 18.'],
['Exercise 1 (Exercises 2.4)','27 (slide 22); handwritten solution pp. 29–33',r`Determine whether the equation is exact. If it is exact, solve it: \((5x+4y)dx+(4x-8y^3)dy=0\)`,'Exact (per the handwritten check)','Exactness test, partial integration; shortcut also shown','e',
 r`Handwritten: \(M=5x+4y,\ N=4x-8y^3\); \(\frac{\partial M}{\partial y}=4\), \(\frac{\partial N}{\partial x}=4\), so it is exact. \(\int(5x+4y)dx=\tfrac{5x^2}{2}+4xy+g(y)\); differentiating by y: \(4x+g'(y)=4x-8y^3\), so \(g'(y)=-8y^3\), \(g(y)=-2y^4\).<br><b class="a">Answer:</b> \(f(x,y)=\tfrac{5x^2}{2}+4xy-2y^4\). The shortcut (p. 33) gives the same f from \(\int M\,dx\) and \(\int N\,dy\) “without repeats”. The PDF does not write the final “= c”.`,
 'Check 4 = 4, integrate 5x + 4y by x, then fix the y-part with 4x − 8y³ to get −2y⁴.'],
['Exercise 2 (Exercises 2.4)','27 (partial handwriting p. 28)',r`Solve the IVP: \((e^{x}+y)dx+(2+x+ye^{y})dy=0,\ y(0)=1\)`,'Not clear from the PDF','Not clear from the PDF','p',
 r`Handwritten start (p. 28): \(\frac{\partial M}{\partial y}=0+1=1\); the check of \(\frac{\partial N}{\partial x}\) is cut off. No final answer is given in the PDF.`]
]},
{
n:4,sec:'2.5',t:'Solutions by Substitutions',f:'Lecture_2_5.pdf',pg:21,
obj:'Objectives (p. 3): solve DEs using substitution; solve Bernoulli equations by turning them into linear first-order equations.',
note:'Page numbers are PDF page positions. Pages 8, 9, 11, 14 and 15 are handwritten work or photos. Example 3 is printed as slide 12 and Example 4 as slide 14.',
terms:[
['Substitution',
 r`Replacing y by \(y=g(x,u)\), with \(u\) a function of \(x\), to turn the DE into another DE (p. 5). By the chain rule \(\frac{dy}{dx}=g_x(x,u)+g_u(x,u)\frac{du}{dx}\), and the DE becomes \(\frac{du}{dx}=F(x,u)\). If \(u=\phi(x)\) solves that, then \(y=g(x,\phi(x))\) solves the original.`,
 'The equation does not fall into a class you know (separable, linear, exact); the intro on p. 4 says this section may help then.',
 'Sections 2.2 to 2.4 solve their own classes directly; substitution is for equations that do not fit one.',
 r`Bernoulli equations with \(u=y^{1-n}\) (pp. 6–20).`,
 'Swap an awkward piece for a new letter u so the equation becomes one you can already solve, then swap back at the end.'],
['Bernoulli equation',
 r`\(\frac{dy}{dx}+P(x)y=f(x)y^n\), with \(n\) any real number (p. 6, eq. (4)).`,
 r`A left side \(\frac{dy}{dx}+P(x)y\) and a right side that is \(f(x)\) times a power of \(y\).`,
 'For n = 0 and n = 1 it is linear (p. 6). Otherwise it is not linear (the handwritten note on p. 6 says non-linear), which is why a substitution is needed.',
 r`\(y'+\frac4xy=x^3y^2\) (n = 2, p. 7); \(y'=5y+e^{-2x}y^{-2}\) (n = −2, p. 10).`,
 'It is a linear equation with an extra power of y on the right. That power n tells you the substitution.'],
['The Bernoulli substitution u = y^(1−n)',
 r`For \(n\neq0,1\), the substitution \(u=y^{1-n}\) reduces any equation of form (4) to a linear equation (p. 6).`,
 'Read n, then use 1 − n as the power in u.',
 r`Examples: \(n=2\to y^{-1}\); \(n=-2\to y^{3}\); \(n=4\to y^{-3}\); \(n=\tfrac12\to y^{1/2}\) (the slides call the new variable v or u).`,
 r`Example 2: \(u=y^{-1}\) (p. 16). Example 4: \(u=y^{3}\) (p. 19).`,
 'Subtract n from 1 and use that as the new power of y.'],
['Linear equation after the substitution',
 r`The substituted equation is linear in \(u\), and the PDF solves it with the integrating factor (Examples 2 to 4).`,
 r`It has the form \(\frac{du}{dx}+P(x)u=f(x)\) (Example 2: \(\frac{du}{dx}-\frac1xu=-x\)).`,
 'It is still an equation in u: you must substitute back to y at the end.',
 r`Example 3: \(\frac{du}{dx}-3u=-3x\) with integrating factor \(e^{-3x}\) (pp. 17–18).`,
 'After the swap you have an equation like the ones in Section 2.3, just with u in place of y.'],
['Other classifications',
 'The intro (p. 4) names separable, linear and exact as classes you can recognize. Homogeneous and others: Not clear from the PDF.',
 'Not clear from the PDF.','Not clear from the PDF.','None.',
 'Only Bernoulli equations are classified in this PDF.']
],
meth:[
{n:'Substitution (general idea)',
 rec:'An equation that does not fit a class you know (p. 4).',
 when:'The PDF gives only the general scheme and then works Bernoulli examples. How to choose g in general: Not clear from the PDF.',
 fm:r`\[y=g(x,u)\ \Rightarrow\ \frac{dy}{dx}=g_x(x,u)+g_u(x,u)\frac{du}{dx}\ \Rightarrow\ \frac{du}{dx}=F(x,u)\]`,
 st:['Choose a substitution y = g(x,u), with u a function of x.','Differentiate with the chain rule.','Replace dy/dx and y in the equation and solve for du/dx = F(x,u).','Solve for u = φ(x).','The solution of the original equation is y = g(x, φ(x)).'],
 exl:'Bernoulli examples, pp. 16–20',
 ex:r`The Bernoulli examples use this scheme with \(u=y^{1-n}\) (next method).`,
 why:'The first step in solving a DE is often to transform it into another DE by a substitution (p. 5).',
 mi:['Do not stop at u: the original solution is y = g(x, φ(x)).'],
 z:'Replace the awkward part with u, solve the easier equation for u, then put u back to get y.'},
{n:'Solving a Bernoulli equation',
 rec:r`\(\frac{dy}{dx}+P(x)y=f(x)y^n\) with \(n\neq0,1\).`,
 when:'For n = 0 or n = 1 the equation is already linear (p. 6).',
 fm:r`\[u=y^{1-n}\ \Longrightarrow\ \text{a linear equation in }u\]`,
 st:['Get the equation into the form (4) so you can read n (Example 2 divides by x; Example 1(c) divides by a power of y).',r`Substitute \(u=y^{1-n}\). Use the chain rule (Example 2: \(\frac{dy}{dx}=-u^{-2}\frac{du}{dx}\)) or \(du\) and \(dy\) (Examples 3, 4).`,'Simplify to a linear equation in u and put it in standard form.','Solve it with the integrating factor (Chapter 2).','Substitute back u = y^(1−n) (Example 2: y = 1/u).','With an initial condition, find the constant (Example 4).'],
 exl:'Example 2, p. 16',
 ex:r`\[xy'+y=x^2y^2\Rightarrow y'+\tfrac1xy=xy^2,\ u=y^{-1}\Rightarrow\frac{du}{dx}-\frac1xu=-x\]\[e^{-\int dx/x}=x^{-1},\ \tfrac{d}{dx}[x^{-1}u]=-1\Rightarrow u=-x^2+cx\Rightarrow y=\frac{1}{-x^2+cx}\]`,
 why:'Here n = 2, so u = y^(1−2) = y^(−1), which turns the equation into a linear one.',
 mi:['Example 1(b) has n = −2, so u = y³ (not y^(−3)).','Example 1(a): −v′ + (4/x)v = x³ is rewritten as v′ − (4/x)v = −x³ before solving.','Do not stop at u: Example 2 ends with y = 1/u.'],
 z:'Find n, set u = y^(1−n), and the equation turns into a linear one. Solve for u, then swap back to y.'}
],
qs:[
['Example 1(a): convert to linear','7 (handwritten pp. 8–9)',r`Convert to a linear DE: \(y'+\frac4xy=x^3y^2\)`,'Bernoulli, n = 2','Substitution \(u=y^{1-n}\)','s',
 r`\(v=y^{-1},\ v'=-y^{-2}y'\). The equation becomes \(-v'+\frac4xv=x^3\).<br><b class="a">Answer:</b> \(v'-\frac4xv=-x^3\). The handwritten pages use \(u\) with \(dy=-y^2du\) and reach \(\frac{du}{dx}-\frac4xu=-x^3\).`,
 'Here n = 2, so v = y^(−1). The substitution turns the y² into a plain v and leaves a linear equation.'],
['Example 1(b): convert to linear','10 (handwritten p. 11)',r`Convert to a linear DE: \(y'=5y+e^{-2x}y^{-2}\)`,'Bernoulli, n = −2','Substitution \(u=y^{1-n}\)','s',
 r`\(v=y^3,\ v'=3y^2y'\). Plugging in gives \(\frac13v'-5v=e^{-2x}\).<br><b class="a">Answer:</b> \(v'-15v=3e^{-2x}\). The handwritten photo (p. 11) appears to show \(3e^{-3x}\) in its boxed result; the typed slide shows \(e^{-2x}\).`,
 'Since n = −2, 1 − n = 3, so v = y³. Multiply by 3 to clear the 1/3.'],
['Example 1(c): convert to linear','12 (handwritten p. 14)',r`Convert to a linear DE: \(6y'-2y=xy^4\)`,'Bernoulli, n = 4','Substitution \(u=y^{1-n}\)','s',
 r`Proper form first: \(6y^{-4}y'-2y^{-3}=x\). Then \(v=y^{-3},\ v'=-3y^{-4}y'\), and plugging in gives \(-2v'-2v=x\).<br><b class="a">Answer:</b> \(v'+v=-\tfrac12x\). Part two of the handwritten photo (p. 14) goes on to solve it with the integrating factor \(e^{x}\); its final line is hard to read. Not clear from the PDF.`,
 'n = 4 gives v = y^(−3). Divide by y⁴ first so the right side is just x, then substitute.'],
['Example 1(d): convert to linear','13 (handwritten p. 15)',r`Convert to a linear DE: \(y'+\frac yx-\sqrt y=0\)`,'Bernoulli, n = 1/2','Substitution \(u=y^{1-n}\)','s',
 r`Proper form: \(y'+\frac1xy=y^{1/2}\Rightarrow y^{-1/2}y'+\frac1xy^{1/2}=1\). Then \(v=y^{1/2},\ v'=\frac12y^{-1/2}y'\), and plugging in gives \(2v'+\frac1xv=1\).<br><b class="a">Answer:</b> \(v'+\frac{1}{2x}v=\frac12\)`,
 'Move the root to the right as y^(1/2), so n = 1/2 and v = y^(1/2).'],
['Example 2: Solving a Bernoulli DE','16',r`Solve \(x\frac{dy}{dx}+y=x^2y^2\).`,'Bernoulli, n = 2','Substitution \(u=y^{-1}\), then integrating factor','s',
 r`Divide by \(x\): \(\frac{dy}{dx}+\frac1xy=xy^2\). With \(n=2\): \(u=y^{-1}\), \(y=u^{-1}\); chain rule: \(\frac{dy}{dx}=\frac{dy}{du}\frac{du}{dx}=-u^{-2}\frac{du}{dx}\). Result: \(\frac{du}{dx}-\frac1xu=-x\). Integrating factor on \((0,\infty)\): \(e^{-\int dx/x}=e^{-\ln x}=e^{\ln x^{-1}}=x^{-1}\). \(\frac{d}{dx}[x^{-1}u]=-1\) gives \(x^{-1}u=-x+c\), i.e. \(u=-x^2+cx\).<br><b class="a">Answer:</b> \(y=\dfrac{1}{-x^2+cx}\)`,
 'Divide by x, set u = 1/y, solve the linear equation for u, then flip back: y = 1/u.'],
['Example 3: Solving a Bernoulli DE','17–18 (slides 12–13)',r`Solve \(\frac{dy}{dx}=y(xy^3-1)\).`,'Bernoulli, n = 4','Substitution \(u=y^{-3}\), then integrating factor','s',
 r`Standard form: \(\frac{dy}{dx}+y=xy^4\). With \(u=y^{-3}\): \(du=-3y^{-4}dy\Rightarrow dy=-\frac13y^4du\). Rewriting: \(\frac{du}{dx}-3u=-3x\). Integrating factor \(e^{\int p(x)dx}=e^{-3x}\): \(\frac{d}{dx}[e^{-3x}u]=-3xe^{-3x}\), \(e^{-3x}u=\int-3xe^{-3x}dx\), \(u=x+\frac13+Ce^{3x}\).<br><b class="a">Answer (substituting back):</b> \(y^{-3}=x+\frac13+Ce^{3x}\). This is the same equation as Exercise 17.`,
 'Multiply out the right side to see y⁴ (n = 4), so u = y^(−3). The linear equation is solved with e^(−3x).'],
['Example 4: Solving an IVP','19–20 (slides 14–15)',r`Solve the IVP \(xy^2\frac{dy}{dx}=y^3-x^3,\ y(1)=2\).`,'Bernoulli, n = −2, IVP','Substitution \(u=y^3\), integrating factor, initial condition','s',
 r`Dividing by \(y^2\) and rearranging: \(\frac{dy}{dx}=\frac1xy-x^2y^{-2}\), in standard form \(\frac{dy}{dx}-\frac1xy=-x^2y^{-2}\). With \(u=y^3\): \(du=3y^2dy\Rightarrow dy=\frac13y^{-2}du\). Rewriting: \(\frac{du}{dx}-\frac3xu=-3x^2\). Integrating factor \(e^{-3\int dx/x}=x^{-3}\): \(\frac{d}{dx}[x^{-3}u]=-3x^{-1}\), \(u=-3x^3\ln|x|+Cx^3\). Substituting back: \(y^3=-3x^3\ln|x|+Cx^3\). With \(y(1)=2\): \(2^3=-3\ln(1)+C(1^3)\Rightarrow C=8\).<br><b class="a">Answer:</b> \(y^3=-3x^3\ln|x|+8x^3\)`,
 'Rearrange to see y^(−2) on the right (n = −2), so u = y³. Solve for u, put y³ back, then use y(1) = 2 to get C = 8.'],
['Exercise 15','21',r`\(x\dfrac{dy}{dx}+y=\dfrac{1}{y^2}\)`,TY,SB,'p',NS],
['Exercise 16','21',r`\(\dfrac{dy}{dx}-y=e^{x}y^2\)`,TY,SB,'p',NS],
['Exercise 17','21',r`\(\dfrac{dy}{dx}=y(xy^3-1)\)`,TY,SB,'p','No separate solution is given; this is the same equation as Example 3 (pp. 17–18).'],
['Exercise 18','21',r`\(x\dfrac{dy}{dx}-(1+x)y=xy^2\)`,TY,SB,'p',NS],
['Exercise 19','21',r`\(t^2\dfrac{dy}{dt}+y^2=ty\)`,TY,SB,'p',NS],
['Exercise 20','21',r`\(3(1+t^2)\dfrac{dy}{dt}=2ty(y^3-1)\)`,TY,SB,'p',NS]
]},(()=>{const P=(pg,ty,me,l)=>l.map(e=>[e[0],pg,'\\('+e[1]+'\\)',ty,me,'p',NS]),T='Second-order, constant coefficients',A='Auxiliary equation (the section method)';

terms:[
['Second-order equation (order)',
 r`Order = the highest derivative present. This PDF works with \(ay''+by'+cy=0\), so \(y''\) is the highest derivative (p. 5).`,

['Homogeneous linear with constant coefficients',

['Auxiliary equation',

['The three cases for the roots',
 r`The roots \(m_{1,2}=\frac{-b\pm\sqrt{b^2-4ac}}{2a}\) give three cases (pp. 7–8): real distinct (\(b^2-4ac>0\)), real repeated (\(b^2-4ac=0\)), conjugate complex (\(b^2-4ac<0\)).`,
 r`Solve the quadratic and look at the roots, or at \(b^2-4ac\).`,

['Second-order initial-value problem',

['Boundary-value problem (Problems 37–40)',

meth:[
{n:'Auxiliary-equation method',
 rec:r`An equation \(ay''+by'+cy=0\) with constant a, b, c.`,
 when:'Homogeneous, linear, second-order, constant coefficients (Objectives, p. 3).',
 fm:r`\[am^2+bm+c=0,\qquad m_{1,2}=\frac{-b\pm\sqrt{b^2-4ac}}{2a}\]<p>Distinct real roots \(m_1\neq m_2\): \(y=C_1e^{m_1x}+C_2e^{m_2x}\)</p><p>Repeated real roots \(m_1=m_2\): \(y=C_1e^{m_1x}+C_2xe^{m_1x}\)</p><p>Conjugate complex roots \(m=\alpha\pm i\beta\): \(y=C_1e^{\alpha x}\cos\beta x+C_2e^{\alpha x}\sin\beta x\)</p>`,
 st:['Write the equation as ay″ + by′ + cy = 0.',r`Try \(y=e^{mx}\), so \(y'=me^{mx}\) and \(y''=m^2e^{mx}\). Substitute and factor out \(e^{mx}\) (p. 6).`,r`Since \(e^{mx}\neq0\), solve \(am^2+bm+c=0\) by factoring or the quadratic formula.`,'Decide which of the three cases the roots fall into.','Write the general solution for that case. For complex roots read α and β from the roots.'],
 exl:'Example 1(a), pp. 9–11',
 ex:r`\[2y''-5y'-3y=0\Rightarrow2m^2-5m-3=(2m+1)(m-3)=0\Rightarrow m_1=-\tfrac12,\ m_2=3\]\[y=C_1e^{-x/2}+C_2e^{3x}\]`,
 why:r`Substituting \(y=e^{mx}\) turns the differential equation into the algebra problem \(am^2+bm+c=0\), because \(e^{mx}\) is never 0 (p. 6).`,
 mi:[r`Repeated root: the second term needs the extra x (Ex. 1(b): \(C_2xe^{5x}\)).`,r`Complex roots: take α and β from the roots (Ex. 1(c): \(\alpha=-2,\ \beta=\sqrt3\)).`,r`When \(\alpha=0\), \(e^0=1\), so only cos and sin remain (Ex. 2(a)).`,r`Keep the leading coefficient: Ex. 2(b) gives \(4m^2-4m-3=0\).`,r`The PDF states \(\alpha,\beta>0\) (pp. 7, 9), yet Ex. 1(c) has \(\alpha=-2\) and Ex. 2(a) has \(\alpha=0\).`],
 z:'Guess y = e^(mx), plug in, and the equation turns into a quadratic in m. The roots decide the answer.'},
{n:'Solving a second-order initial-value problem',
 rec:r`A constant-coefficient equation followed by conditions \(y(0)\) and \(y'(0)\).`,
 when:'You need one particular solution (Examples 2, 3).',
 fm:r`\[\text{general solution}\ \Rightarrow\ \text{differentiate}\ \Rightarrow\ \text{use }y(0),\ y'(0)\text{ to find }C_1,\ C_2\]`,
 st:['Find the general solution (method above).',r`Differentiate it to get \(y'\) (Ex. 2(a): \(y'=-4C_1\sin4x+4C_2\cos4x\)).`,'Put the given x-value into y and y′ to get two equations in C₁ and C₂.',r`Solve them (Ex. 2(b): \(C_1+C_2=1\) and \(\tfrac32C_1-\tfrac12C_2=5\)).`,'Put C₁ and C₂ back into the general solution.'],
 exl:'Example 2(a), pp. 16–18',
 ex:r`\[y=C_1\cos4x+C_2\sin4x,\ \ y(0)=2\Rightarrow C_1=2,\ \ y'(0)=2\Rightarrow4C_2=2\Rightarrow C_2=\tfrac12\]\[y=2\cos4x+\tfrac12\sin4x\]`,
 why:'Two constants need two conditions: y(0) and y′(0).',
 mi:['Differentiate before applying y′(0).',r`Ex. 3: differentiate the whole product \(e^{-x/2}(\dots)\); \(y'(0)=2\) gives \(2c_2+\tfrac12=2\) (p. 21).`],
 z:'First solve in general. Then use the starting value and the starting slope to pin down C₁ and C₂.'}
],
qs:[
['Example 1(a): Second-Order DEs','9–11 (also p. 15)',r`Solve \(2y''-5y'-3y=0\).`,T,'Auxiliary equation (distinct real roots)','s',
 r`\(2m^2-5m-3=(2m+1)(m-3)=0\), \(m_1=-\tfrac12,\ m_2=3\).<br><b class="a">Answer:</b> \(y=C_1e^{-x/2}+C_2e^{3x}\)`,
 'Two different real roots, so one exponential for each.'],
['Example 1(b): Second-Order DEs','12 (also p. 15)',r`Solve \(y''-10y'+25y=0\).`,T,'Auxiliary equation (repeated real root)','s',
 r`\(m^2-10m+25=(m-5)^2=0\), \(m_1=m_2=5\) (repeated roots).<br><b class="a">Answer:</b> \(y=C_1e^{5x}+C_2xe^{5x}\)`,
 'One root repeated, so the second solution gets an extra x.'],
['Example 1(c): Second-Order DEs','13–14 (also p. 15)',r`Solve \(y''+4y'+7y=0\).`,T,'Auxiliary equation (complex roots)','s',
 r`\(m^2+4m+7=0\); quadratic formula: \(m_{1,2}=\frac{-4\pm\sqrt{-12}}{2}=-2\pm\sqrt3\,i\), so \(\alpha=-2,\ \beta=\sqrt3\).<br><b class="a">Answer:</b> \(y=C_1e^{-2x}\cos(\sqrt3x)+C_2e^{-2x}\sin(\sqrt3x)\)`,
 'The roots come as a pair with i, so the answer uses cos and sin with e^(αx).'],
['Example 2(a): An Initial-Value Problem','16–18',r`Solve \(y''+16y=0,\ y(0)=y'(0)=2\).`,'Second-order IVP','Auxiliary equation, then initial conditions','s',
 r`\(m^2+16=0\), \(m_{1,2}=\pm4i\) (\(\alpha=0,\ \beta=4\)): \(y=C_1\cos4x+C_2\sin4x\). \(y(0)=2\Rightarrow C_1=2\). \(y'=-4C_1\sin4x+4C_2\cos4x\), \(y'(0)=2\Rightarrow C_2=\tfrac12\).<br><b class="a">Answer:</b> \(y=2\cos4x+\tfrac12\sin4x\)`,
 'Imaginary roots with no real part, so just cos and sin. Then the two conditions fix C₁ and C₂.'],
['Example 2(b): An Initial-Value Problem','19–20',r`Solve \(4y''-4y'-3y=0,\ y(0)=1,\ y'(0)=5\).`,'Second-order IVP','Auxiliary equation, then initial conditions','s',
 r`\(4m^2-4m-3=0\): \(m_1=\tfrac32,\ m_2=-\tfrac12\), so \(y=C_1e^{3x/2}+C_2e^{-x/2}\). \(y(0)=1\Rightarrow C_1+C_2=1\); \(y'(0)=5\Rightarrow\tfrac32C_1-\tfrac12C_2=5\).<br><b class="a">Answer:</b> \(y=\tfrac{11}{4}e^{3x/2}-\tfrac74e^{-x/2}\)`,
 'Two real roots give two exponentials. The two conditions become two simple equations for C₁ and C₂.'],
['Example 3: An IVP (second order)','21',r`Solve \(4y''+4y'+17y=0,\ y(0)=-1,\ y'(0)=2\).`,'Second-order IVP','Auxiliary equation, then initial conditions','s',
 r`Roots of \(4m^2+4m+17=0\): \(m_{1,2}=-\tfrac12\pm2i\), so \(y=e^{-x/2}(c_1\cos2x+c_2\sin2x)\). \(y(0)=-1\Rightarrow c_1=-1\). Differentiating and using \(y'(0)=2\): \(2c_2+\tfrac12=2\), so \(c_2=\tfrac34\).<br><b class="a">Answer:</b> \(y=e^{-x/2}\left(-\cos2x+\tfrac34\sin2x\right)\)`,
 'Complex roots give e^(−x/2) times cos and sin. Use y(0) for c₁, then differentiate for c₂.']
].concat(
P('22',T,A,[['Exercise a (p. 22)',r`y''+2y'=0`],['Exercise b (p. 22)',r`y''-5y=0`]]),
P('23',T,A,[['Problem 1 (Exercises 4.3)',r`4y''+y'=0`],['Problem 2 (Exercises 4.3)',r`y''-36y=0`],['Problem 3 (Exercises 4.3)',r`y''-y'-6y=0`],['Problem 4 (Exercises 4.3)',r`y''-3y'+2y=0`],['Problem 5 (Exercises 4.3)',r`y''+8y'+16y=0`],['Problem 6 (Exercises 4.3)',r`y''-10y'+25y=0`],['Problem 7 (Exercises 4.3)',r`12y''-5y'-2y=0`],['Problem 8 (Exercises 4.3)',r`y''+4y'-y=0`],['Problem 9 (Exercises 4.3)',r`y''+9y=0`],['Problem 10 (Exercises 4.3)',r`3y''+y=0`],['Problem 11 (Exercises 4.3)',r`y''-4y'+5y=0`],['Problem 12 (Exercises 4.3)',r`2y''+2y'+y=0`],['Problem 13 (Exercises 4.3)',r`3y''+2y'+y=0`],['Problem 14 (Exercises 4.3)',r`2y''-3y'+4y=0`]]),

)};})(),{

obj:'Objective (p. 3): find the general solution of a homogeneous linear second-order equation.',
note:'Page numbers are PDF page positions. Pages 7, 11, 13, 16 and 19 are photos of handwritten work; page 21 is blank.',
terms:[
['Homogeneous linear second-order equation',
 r`\(a_2(x)y''+a_1(x)y'+a_0(x)y=0\) (p. 4, equation (1)).`,
 r`\(y''\), \(y'\) and \(y\) each have a coefficient (it may depend on x) and the right side is 0.`,
 'Non-homogeneous or higher-order equations: Not clear from the PDF (not treated here).',
 r`Example 1: \(x^2y''-3xy'+4y=0\) (p. 6).`,
 'An equation with y″, y′ and y, each with a coefficient (it can depend on x), and a zero on the right.'],
['Standard form y″ + P(x)y′ + Q(x)y = 0',
 r`Equation (1) divided by \(a_2(x)\), so the coefficient of \(y''\) is 1 (p. 5).`,
 r`Nothing in front of \(y''\). Then \(P(x)\) is the coefficient of \(y'\).`,
 r`Not yet standard: \(x^2y''-3xy'+4y=0\); dividing by \(x^2\) gives \(y''-\frac3xy'+\frac4{x^2}y=0\) (p. 6).`,
 r`Example 2: \(y''-y=0\) is already standard, \(P(x)=0\) (p. 9).`,
 'Divide so that y″ stands alone with coefficient 1. Then read off P(x), the number or function in front of y′.'],
['A given solution y₁',
 'The method starts from one known solution y₁ of the equation (the problems say “Given y₁ = … is a solution”). A handwritten note says y₁ is always given in this method (p. 4).',
 r`Look for the words “Given \(y_1=\dots\) is a solution” (p. 6 onwards).`,
 'How to find y₁ yourself: Not clear from the PDF.',
 r`\(y_1=x^2\) (Ex. 1), \(y_1=e^{x}\) (Ex. 2), \(y_1=1\) (Ex. 3), \(y_1=\cos4x\) (Ex. 4), \(y_1=xe^{-x}\) (Ex. 5).`,
 'You are handed one working answer. The method builds a second one from it.'],
['Linearly independent solutions y₁, y₂',
 r`The formula produces a \(y_2\) such that \(y_1\) and \(y_2\) are linearly independent (p. 5).`,
 'The PDF states that they are independent but shows no test for it: Not clear from the PDF.',
 'A solution that is just a multiple of y₁ would not give a second constant: Not clear from the PDF.',
 r`Ex. 1: \(y_1=x^2\) and \(y_2=x^2\ln x\) (p. 8).`,
 'y₁ and y₂ are two genuinely different solutions, not copies of each other.'],
['General solution y = C₁y₁ + C₂y₂',
 r`With \(y_1,y_2\) linearly independent, the general solution of (1) is \(y=C_1y_1+C_2y_2\) (p. 5).`,
 'Two arbitrary constants for a second-order equation.',
 'The slides sometimes rename constants: Ex. 2 writes −C₂/2 as C (p. 10).',
 r`Ex. 4: \(y=C_1\cos4x+C_2\sin4x\) (p. 15).`,
 'Add your two solutions, each with its own constant.']
],
meth:[
{n:'Reduction of order (finding y₂ from a given y₁)',
 rec:'A homogeneous linear second-order equation together with one given solution y₁.',
 when:'y₁ is given (p. 4). The formula returns a y₂ that is linearly independent of y₁ (p. 5).',
 fm:r`\[y''+P(x)y'+Q(x)y=0,\qquad y_2=y_1(x)\int\frac{e^{-\int P(x)\,dx}}{y_1^{2}(x)}\,dx,\qquad y=C_1y_1+C_2y_2\]`,
 st:['Write the ODE in standard form y″ + P(x)y′ + Q(x)y = 0 (divide by the coefficient of y″).',r`Compute \(-\int P(x)\,dx\).`,r`Substitute into the formula to find \(y_2\).`,r`The general solution is \(y=C_1y_1+C_2y_2\).`],
 exl:'Example 1, pp. 6–8',
 ex:r`\[x^2y''-3xy'+4y=0,\ y_1=x^2\ \Rightarrow\ y''-\tfrac3xy'+\tfrac4{x^2}y=0,\ \ -\!\int P\,dx=3\ln x=\ln x^3\]\[y_2=x^2\int\frac{e^{\ln x^3}}{(x^2)^2}dx=x^2\int\frac{x^3}{x^4}dx=x^2\int\frac1x\,dx=x^2\ln x\]\[y=C_1x^2+C_2x^2\ln x\]`,
 why:'The formula builds the second solution from y₁ and P(x) alone, so one known solution is enough to reach the general solution.',
 mi:[r`Standard form first: read \(P(x)\) only after the \(y''\) coefficient is 1 (Ex. 1 divides by \(x^2\), so \(P=-\frac3x\)).`,r`If \(P(x)=0\), then \(e^{-\int P\,dx}=e^0=1\) (handwritten note, p. 11; Ex. 2 and 4).`,r`A constant factor in \(y_2\) can be dropped: Ex. 4 gets \(\frac14\sin4x\) and uses \(\sin4x\); a handwritten note says the constant can be ignored (p. 16).`,r`Printed slip: the typed slide for Ex. 5 (p. 18) appears to give \(C_2xe^{-x}\), but \(y_2=-e^{-x}\) and the handwritten photo (p. 19) give \(C_2e^{-x}\).`],
 z:'You are given one solution. The formula hands you a second, different one. Combine them with two constants.'}
],
qs:[
['Example 1 (reduction of order)','6–8 (handwritten p. 7)',r`If \(y_1=x^2\) is a solution of \(x^2y''-3xy'+4y=0\), find the general solution.`,'Homogeneous linear second-order, y₁ given','Reduction of order','s',
 r`Standard form: \(y''-\frac3xy'+\frac4{x^2}y=0\), \(P=-\frac3x\), \(-\int P\,dx=3\ln x=\ln x^3\). \(y_2=x^2\int\frac{e^{\ln x^3}}{(x^2)^2}dx=x^2\int\frac{x^3}{x^4}dx=x^2\ln x\).<br><b class="a">Answer:</b> \(y=C_1x^2+C_2x^2\ln x\) (\(y_1\) and \(y_2\) are linearly independent)`,
 'Divide by x² first. Then P = −3/x, and the formula gives the extra solution x² ln x.'],
['Example 2 (reduction of order)','9–11 (handwritten p. 11)',r`If \(y_1=e^{x}\) is a solution of \(y''-y=0\), find the general solution.`,'Homogeneous linear second-order, y₁ given','Reduction of order','s',
 r`\(P=0\), so \(-\int P\,dx=0\). \(y_2=e^{x}\int\frac{e^0}{(e^x)^2}dx=e^{x}\int e^{-2x}dx=e^{x}\frac{e^{-2x}}{-2}=-\frac{e^{-x}}{2}\).<br><b class="a">Answer:</b> \(y=C_1e^{x}-C_2\frac{e^{-x}}{2}\), written \(y=C_1e^{x}+Ce^{-x}\)`,
 'P = 0, so the exponential in the formula is just 1. The integral gives e^(−x) up to a constant.'],
['Example 3 (reduction of order)','12–13 (handwritten p. 13)',r`If \(y_1=1\) is a solution of \(y''+y'=0\), find the general solution.`,'Homogeneous linear second-order, y₁ given','Reduction of order','s',
 r`\(P=1\), \(-\int P\,dx=-x\). \(y_2=(1)\int\frac{e^{-x}}{(1)^2}dx=\int e^{-x}dx=-e^{-x}\).<br><b class="a">Answer:</b> \(y=C_1+Ce^{-x}\)`,
 'With y₁ = 1, the formula is just the integral of e^(−x). The second solution is e^(−x), up to sign.'],
['Example 4 (reduction of order)','14–16 (handwritten p. 16)',r`Given \(y_1=\cos4x\) is a solution of \(y''+16y=0\), find the general solution.`,'Homogeneous linear second-order, y₁ given','Reduction of order','s',
 r`\(P=0\), so \(e^{0}=1\). \(y_2=\cos(4x)\int\frac{1}{\cos^2(4x)}dx=\cos(4x)\int\sec^2(4x)\,dx=\cos(4x)\frac{\tan(4x)}{4}=\tfrac14\sin(4x)\) (using \(\sec u=\frac1{\cos u}\)).<br><b class="a">Answer:</b> \(y=C_1\cos(4x)+C_2\sin(4x)\)`,
 'The integral of 1/cos² is a tangent. Multiplying by cos gives a sine. The 1/4 is only a constant, so it is dropped.'],
['Example 5 (reduction of order)','17–19 (handwritten p. 19)',r`Given \(y_1=xe^{-x}\) is a solution of \(y''+2y'+y=0\), find the general solution.`,'Homogeneous linear second-order, y₁ given','Reduction of order','s',
 r`\(P=2\), \(-\int P\,dx=-2x\). \(y_2=xe^{-x}\int\frac{e^{-2x}}{(xe^{-x})^2}dx=xe^{-x}\int\frac1{x^2}dx=xe^{-x}\int x^{-2}dx=xe^{-x}\frac{x^{-2+1}}{-2+1}=-e^{-x}\).<br><b class="a">Answer:</b> the handwritten photo (p. 19) gives \(y=C_1xe^{-x}+C_2e^{-x}\). The typed slide (p. 18) appears to print \(C_2xe^{-x}\) instead, which does not match \(y_2=-e^{-x}\).`,
 'The e^(−2x) cancels against the square of x e^(−x), leaving 1/x². Integrating gives −1/x, and multiplying by x e^(−x) leaves e^(−x).'],
['Exercise 1 (Exercises 4.2)','20',r`Given \(y_1=e^{5x}\) is a solution of \(y''-25y=0\), find the general solution.`,'Homogeneous linear second-order, y₁ given','Reduction of order','p',NS],
['Exercise 2 (Exercises 4.2)','20',r`Given \(y_1=\sin3x\) is a solution of \(y''+9y=0\), find the general solution.`,'Homogeneous linear second-order, y₁ given','Reduction of order','p',NS]
]},{
n:5,sec:'4.1',t:'Preliminary Theory: Linear Equations',f:'lec_4_1_2.pdf',pg:37,
obj:'Objectives (p. 3): distinguish initial-value from boundary-value problems; determine the type of solution of a BVP; find a fundamental set of solutions of a homogeneous ODE; find general solutions of homogeneous and nonhomogeneous ODEs.',
note:'Page numbers are PDF page positions in lec_4_1_2.pdf. Many pages carry handwritten notes or are photos of the screen (for example pp. 11–12, 24, 31, 33). The file lec_4_1.pdf has the same typed slides without the handwriting, so its page numbers are lower.',
terms:[
['Linear initial-value problem (nth order)',
 r`Solve \(a_n(x)\frac{d^ny}{dx^n}+\dots+a_1(x)\frac{dy}{dx}+a_0(x)y=g(x)\) subject to \(y(x_0)=y_0,\ y'(x_0)=y_1,\dots,y^{(n-1)}(x_0)=y_{n-1}\) (p. 4, eq. (1)).`,
 'All the conditions are given at the same point x₀.',
 'In a boundary-value problem the conditions are at different points.',
 r`Example 1: \(y''-4y=12x,\ y(0)=4,\ y'(0)=1\) (p. 7).`,
 'The equation plus clues about one starting point.'],
['Existence and uniqueness (Theorem 4.1.1)',
 r`If \(a_n(x),\dots,a_0(x),g(x)\) are continuous on an interval I, \(a_n(x)\neq0\) for every x in I, and \(x_0\) is in I, then the IVP has a solution on I and it is unique (p. 4).`,
 'Check three things: everything is continuous, the leading coefficient is never 0 on I, and x₀ lies in I.',
 'If \(a_n(x)=0\) for some x in the interval, the solution may not be unique or may not exist (p. 8).',
 r`Example 1: \(y''-4y=12x\) passes (p. 7). \(x^2y''-2xy'+2y=6\) with conditions at \(x=0\) fails because \(a_2(x)=x^2\) is 0 there (p. 8).`,
 'A safety check that tells you when an IVP has exactly one answer.'],
['Boundary-value problem (BVP)',
 r`A linear equation of order two or more with values of y or its derivatives given at different points, e.g. \(y(a)=y_0,\ y(b)=y_1\) (p. 5). Other pairs use \(y'(a)\) or \(y'(b)\) (p. 6).`,
 'Conditions at two different x-values.',
 'Unlike an IVP, a BVP can have many solutions, exactly one, or none (Example 2, pp. 9–10).',
 r`\(x''+16x=0,\ x(0)=0,\ x(\pi/2)=0\) (p. 9).`,
 'Clues at two different places instead of one. The answer can be many, one or no solutions.'],
['Homogeneous and nonhomogeneous',
 r`Homogeneous: \(a_n(x)\frac{d^ny}{dx^n}+\dots+a_0(x)y=0\) (eq. (6)). Nonhomogeneous: the same with \(g(x)\) not identically zero (eq. (7)) (p. 14).`,
 'Look at the right side: 0 or not.',
 'Both need the two assumptions on p. 14: coefficients and g continuous, and \(a_n(x)\neq0\) on the interval.',
 r`Example 1 (p. 17): \(y''+y'=0\) is homogeneous second order; \(y'''-6y''+11y'-6y=3x\) is nonhomogeneous third order.`,
 'Zero on the right means homogeneous. Anything else on the right means nonhomogeneous.'],
['Differential operator D',
 r`\(D=\frac{d}{dx}\), \(D^2y=y''\), \(D^ny=y^{(n)}\); an nth-order operator is \(L=a_n(x)D^n+\dots+a_1(x)D+a_0(x)\) (pp. 15–16).`,
 'Write each derivative as a power of D and factor y out.',
 'It is only notation (a handwritten note on p. 16 says “just notation”).',
 r`\(y''+y'=0\) becomes \((D^2+D)y=0\) (p. 17).`,
 'D is shorthand for “take the derivative”. It only shortens the writing.'],
['Superposition principle (Theorem 4.1.2)',
 r`Any linear combination \(y=c_1y_1+\dots+c_ky_k\) of solutions of a homogeneous linear DE on I is also a solution (p. 18). Corollaries: a constant multiple of a solution is a solution; \(y=0\) is always a solution.`,
 'The equation must be homogeneous and linear.',
 'It says the combination is a solution, not that it is the general solution; that needs independence (below).',
 'Examples 2 and 3 (pp. 19–20).',
 'Add solutions and multiply them by numbers, and you still get solutions.'],
['Linear dependence and independence (Definition 4.1.1)',
 r`Functions are linearly dependent on I if constants \(c_1,\dots,c_n\), not all zero, give \(c_1f_1+\dots+c_nf_n=0\) for every x in I; otherwise they are linearly independent (p. 21). Dependent also means one function is a linear combination of the others (p. 22).`,
 'Try to find constants, not all 0, that make the combination 0, or write one function using the others.',
 'Independent means no such constants exist.',
 r`Example 4: \(\cos^2x,\sin^2x,\sec^2x,\tan^2x\) with \(c=1,1,-1,1\) (p. 22). Example 5 (p. 23).`,
 'Dependent: one function can be built from the others. Independent: each one brings something new.'],
['Wronskian and fundamental set',
 r`The Wronskian \(W(f_1,\dots,f_n)\) is the determinant whose rows are \(f_i\), \(f_i'\), …, \(f_i^{(n-1)}\) (Definition 4.1.2, p. 25). Theorem 4.1.3 (p. 24): n solutions of the homogeneous nth-order DE are linearly independent on I if and only if \(W\neq0\) for every x in I. A fundamental set is n linearly independent solutions (Definition 4.1.3, p. 26).`,
 'Build the n by n determinant and check that it is not zero.',
 'W is for solutions of the DE; Definition 4.1.1 (above) is the general idea.',
 r`Example 6: \(W=-6\neq0\) (p. 27). Example 9: \(W=2e^{6x}\neq0\) (p. 32).`,
 'A single test: if W is not zero, the solutions are truly different.'],
['General solution and complementary function',
 r`Homogeneous (Theorem 4.1.5, p. 26): with a fundamental set, \(y=c_1y_1+\dots+c_ny_n\). Nonhomogeneous (Theorem 4.1.6, p. 34): \(y=c_1y_1+\dots+c_ny_n+y_p\) with \(y_p\) any particular solution. The part \(y_c=c_1y_1+\dots+c_ny_n\) is the complementary function, so \(y=y_c+y_p\) (p. 35).`,
 r`Solve the associated homogeneous equation for \(y_c\), then add one particular solution \(y_p\).`,
 'The homogeneous case has no \(y_p\).',
 r`Example 10 (p. 36): \(y=c_1e^{x}+c_2e^{2x}+c_3e^{3x}-\tfrac{11}{12}-\tfrac12x\).`,
 'Nonhomogeneous answer = (general solution of the homogeneous part) + (one particular solution).']
],
meth:[
{n:'Wronskian test and general solution (homogeneous)',
 rec:'You have n functions that solve a homogeneous nth-order DE and must show they are independent or write the general solution (Examples 6 to 9).',
 when:'The functions are solutions of the homogeneous DE and their number equals the order (Theorem 4.1.3).',
 fm:r`\[W(y_1,y_2)=\begin{vmatrix}y_1&y_2\\y_1'&y_2'\end{vmatrix},\qquad W\neq0\ \Rightarrow\ y=C_1y_1+C_2y_2\]`,
 st:['Write the Wronskian determinant (rows: the functions, their first derivatives, and so on up to order n − 1).','Evaluate it.',r`If \(W\neq0\) the solutions are linearly independent, so they form a fundamental set.`,'Write the general solution y = C₁y₁ + … + Cₙyₙ.'],
 exl:'Example 6, p. 27',
 ex:r`\[W(e^{3x},e^{-3x})=\begin{vmatrix}e^{3x}&e^{-3x}\\3e^{3x}&-3e^{-3x}\end{vmatrix}=-6\neq0\ \Rightarrow\ y=C_1e^{3x}+C_2e^{-3x}\]`,
 why:'Theorem 4.1.3 says independence of solutions is the same as W being non-zero, and Theorem 4.1.5 turns a fundamental set into the general solution.',
 mi:['The Wronskian must be non-zero for every x in the interval (Example 9 gets 2e^(6x), never 0).','Use as many solutions as the order of the equation (Example 7 uses 3 for a third-order ODE).',r`Example 8: \(W=4\cos^2 4x+4\sin^2 4x=4\), using \(\sin^2+\cos^2=1\) (p. 31).`],
 z:'Put the solutions in a determinant. If it is not zero, they are truly different, so add them with constants.'},
{n:'Nonhomogeneous equation: complementary function plus particular solution',
 rec:'A linear equation with g(x) not identically zero (eq. (7)).',
 when:'You can solve the associated homogeneous equation and have a particular solution. How to find y_p: Not clear from the PDF (the PDF says “for now we will go fast about it”, p. 34).',
 fm:r`\[y=y_c+y_p,\qquad y_c=c_1y_1+\dots+c_ny_n\]`,
 st:['Replace g(x) by 0 and find a fundamental set of the homogeneous equation.','Write y_c = c₁y₁ + … + cₙyₙ.','Take a particular solution y_p of the original equation.','Add: y = y_c + y_p.'],
 exl:'Example 10, p. 36',
 ex:r`\[y_p=-\tfrac{11}{12}-\tfrac12x,\quad y_c=c_1e^{x}+c_2e^{2x}+c_3e^{3x}\ \Rightarrow\ y=c_1e^{x}+c_2e^{2x}+c_3e^{3x}-\tfrac{11}{12}-\tfrac12x\]`,
 why:'Theorem 4.1.6: the general solution is the sum of the homogeneous general solution and any one particular solution.',
 mi:['y_c comes from the homogeneous equation (y_c uses Example 9), y_p from the full equation.','The PDF gives y_p in Example 10; it does not show how it was found.'],
 z:'Solve the version with 0 on the right, then add one working answer for the real right side.'},
{n:'Existence check and boundary conditions',
 rec:'An IVP (conditions at one point) or a BVP (conditions at two points).',
 when:'Theorem 4.1.1 for the IVP check; for a BVP apply the conditions to the general solution (Example 2).',
 fm:r`\[\text{IVP: check }a_n(x)\neq0\text{ and continuity on I}\qquad\text{BVP: put }x=a,\ x=b\text{ into the general solution}\]`,
 st:['IVP: check that coefficients and g are continuous and a_n(x) ≠ 0 on an interval containing x₀.','If so, the solution is unique (Example 1).','BVP: write the general solution, substitute each boundary condition, solve for the constants.','Count the results: infinitely many, exactly one, or none (Example 2).'],
 exl:'Example 2(a), p. 9',
 ex:r`\[x=c_1\cos4t+c_2\sin4t,\ x(0)=0\Rightarrow c_1=0,\quad x(\tfrac\pi2)=0\text{ holds for every }c_2\Rightarrow x=c_2\sin4t\]`,
 why:'The IVP theorem tells you when a unique answer is guaranteed; a BVP has no such guarantee.',
 mi:[r`Example 1 (second IVP): \(a_2(x)=x^2\) is 0 at \(x=0\) and the conditions are at \(x=0\), so uniqueness is not guaranteed.`,'Example 2(b): the only solution is x = 0. Example 2(c): the conditions contradict each other, so there is no solution.'],
 z:'Check the guarantee first. For boundary conditions, plug them into the general solution and see how many answers survive.'}
],
qs:[
['Example 1 (unique solution of an IVP)','7',r`Verify that \(y=3e^{2x}+e^{-2x}-3x\) is a solution of the IVP \(y''-4y=12x,\ y(0)=4,\ y'(0)=1\).`,'Linear, nonhomogeneous second-order IVP','Theorem 4.1.1','s',
 r`The equation is linear, the coefficients and \(g(x)=12x\) are continuous, and \(a_2(x)=1\neq0\) on any interval containing \(x=0\).<br><b class="a">Answer:</b> by Theorem 4.1.1 the given function is the unique solution on I.`,
 'All the conditions of the theorem hold, so the answer is guaranteed to be the only one.'],
['Example 1 (second IVP, not unique)','8',r`Verify that \(y=cx^2+x+3\) is a solution of \(x^2y''-2xy'+2y=6,\ y(0)=3,\ y'(0)=1\) on \((-\infty,\infty)\) for any c.`,'Linear IVP (conditions of Theorem 4.1.1 fail)','Theorem 4.1.1','s',
 r`There is no unique solution: it works for any c. Most conditions of Theorem 4.1.1 hold, but \(a_2(x)=x^2\) is 0 at \(x=0\) and the initial conditions are imposed at \(x=0\).<br><b class="a">Answer:</b> no unique solution.`,
 'Because the leading coefficient is 0 where the conditions sit, the theorem gives no guarantee, and many solutions appear.'],
['Example 2(a): A BVP can have many, one, or no solutions','9',r`Boundary-value problem \(x''+16x=0,\ x(0)=0,\ x(\pi/2)=0\), with general solution \(x=c_1\cos4t+c_2\sin4t\).`,'Boundary-value problem','Apply the boundary conditions to the general solution','s',
 r`\(x(0)=0\) gives \(c_1=0\), so \(x=c_2\sin4t\). At \(t=\pi/2\): \(0=c_2\sin2\pi\), true for any \(c_2\).<br><b class="a">Answer:</b> infinitely many solutions \(x=c_2\sin4t\). The handwritten pages (pp. 11–12) repeat the work.`,
 'The second condition is satisfied automatically, so c₂ stays free. That gives infinitely many solutions.'],
['Example 2(b)','10',r`\(x''+16x=0,\ x(0)=0,\ x(\pi/8)=0\)`,'Boundary-value problem','Apply the boundary conditions','s',
 r`\(c_1=0\) again; then \(0=c_2\sin(\pi/2)=c_2\cdot1\).<br><b class="a">Answer:</b> \(x=0\) is the only solution.`,
 'This time the second condition forces c₂ = 0.'],
['Example 2(c)','10',r`\(x''+16x=0,\ x(0)=0,\ x(\pi/2)=1\)`,'Boundary-value problem','Apply the boundary conditions','s',
 r`\(c_1=0\), but \(1=c_2\sin2\pi=c_2\cdot0=0\), a contradiction.<br><b class="a">Answer:</b> no solution.`,
 'The condition asks for 1 but the formula gives 0, so nothing works.'],
['Exercise 1 (family and IVP)','13',r`\(y=c_1e^{x}+c_2e^{-x}\) on \((-\infty,\infty)\); \(y''-y=0,\ y(0)=0,\ y'(0)=1\). Find a member of the family that solves the IVP.`,'Homogeneous second-order IVP','Apply the initial conditions to the family','p',NS],
['Exercise 2 (family and IVP)','13',r`\(y=c_1e^{4x}+c_2e^{-x}\) on \((-\infty,\infty)\); \(y''-3y'-4y=0,\ y(0)=1,\ y'(0)=2\). Find a member of the family that solves the IVP.`,'Homogeneous second-order IVP','Apply the initial conditions to the family','p',NS],
['Exercise 13(a)','13',r`\(y=c_1e^{x}\cos x+c_2e^{x}\sin x\); \(y''-2y'+2y=0\). Is there a member with \(y(0)=1,\ y'(\pi)=0\)?`,'Boundary-value problem','Apply the boundary conditions','p',NS],
['Exercise 13(b)','13',r`Same family: \(y(0)=1,\ y(\pi)=-1\)?`,'Boundary-value problem','Apply the boundary conditions','p',NS],
['Exercise 13(c)','13',r`Same family: \(y(0)=1,\ y(\pi/2)=1\)?`,'Boundary-value problem','Apply the boundary conditions','p',NS],
['Exercise 13(d)','13',r`Same family: \(y(0)=0,\ y(\pi)=0\)?`,'Boundary-value problem','Apply the boundary conditions','p',NS],
['Example 1 (differential operators), part (a)','17',r`Write using differential operators: \(y''+y'=0\)`,'Homogeneous second-order','Differential operator D','s',
 r`\(D^2y+Dy=0\), so \((D^2+D)y=0\).<br><b class="a">Answer:</b> homogeneous second-order ODE.`,
 'Change y″ to D²y and y′ to Dy, then factor out y.'],
['Example 1 (differential operators), part (b)','17',r`Write using differential operators: \(\frac{d^3y}{dx^3}-6\frac{d^2y}{dx^2}+11\frac{dy}{dx}-6y=3x\)`,'Nonhomogeneous third-order','Differential operator D','s',
 r`\(D^3y-6D^2y+11Dy-6y=3x\), so \((D^3-6D^2+11D-6)y=3x\).<br><b class="a">Answer:</b> nonhomogeneous third-order ODE.`,
 'Same idea; the 3x on the right makes it nonhomogeneous.'],
['Example 2 (superposition)','19',r`If \(x_1=\cos4t,\ x_2=\sin4t\) are both solutions of \(x''+16x=0\), can you form a solution based on the superposition principle?`,'Homogeneous second-order','Superposition principle','s',
 r`Yes: \(x=c_1x_1+c_2x_2\).<br><b class="a">Answer:</b> \(x=c_1\cos(4t)+c_2\sin(4t)\)`,
 'Two solutions of a homogeneous equation can be added with constants.'],
['Example 3 (superposition)','20',r`If \(y_1=x^2,\ y_2=x^2\ln x\) are both solutions of the ODE \(x^3y''-2xy'+4y=0\) (as printed), can you form a solution based on the superposition principle?`,'Homogeneous second-order','Superposition principle','s',
 r`\(y=c_1y_1+c_2y_2=c_1x^2+c_2x^2\ln x\); or \(y=c_1x^2\); or \(y=c_2x^2\ln x\); or \(y=0\) (\(c_1=c_2=0\)).<br><b class="a">Answer:</b> yes, all of these are solutions. Note: with the ODE as printed, \(y=x^2\) gives \(2x^3\ne0\); the same pair solves \(x^2y''-3xy'+4y=0\) in Section 4.2 Example 1, so the slide may contain a typo.`,
 'Any constant multiple or sum of the two is again a solution, including 0.'],
['Example 4: Linearly Dependent Set of Functions','22',r`Show that \(f_1=\cos^2x,\ f_2=\sin^2x,\ f_3=\sec^2x,\ f_4=\tan^2x\) are linearly dependent on \((-\pi/2,\pi/2)\).`,'Linear dependence (Definition 4.1.1)','Find constants, not all zero','s',

['Example 5: Linearly Dependent Set of Functions','23',r`Show that \(f_1=\sqrt x+5,\ f_2=\sqrt x+5x,\ f_3=x-1,\ f_4=x^2\) are linearly dependent on \((0,\infty)\).`,'Linear dependence','One function as a combination of the others','s',

['Handwritten illustration under Theorem 4.1.3','24',r`\(y_1=x^2,\ y_2=x+1\): form the Wronskian.`,'Wronskian (illustration)','Wronskian test','i',

['Example 6','27',r`Verify that \(y_1=e^{3x},\ y_2=e^{-3x}\) are linearly independent, then form the general solution of \(y''-9y=0\).`,'Homogeneous second-order','Wronskian test','s',

['Example 7','28–29',r`Determine if \(y_1=x+1,\ y_2=x,\ y_3=x^2\) form a fundamental set of solutions of a general third-order ODE. Then find the general solution if possible.`,'Homogeneous third-order','Wronskian test','s',

['Example 8','30–31',r`Verify that \(y_1=\cos4x,\ y_2=\sin4x\) form a fundamental set of solutions of \(y''+16y=0\). Then form a general solution.`,'Homogeneous second-order','Wronskian test','s',

['Example 9: General Solution of a Homogeneous DE','32–33',r`The functions \(y_1=e^{x},\ y_2=e^{2x},\ y_3=e^{3x}\) satisfy the third-order equation \(y'''-6y''+11y'-6y=0\). Find the general solution.`,'Homogeneous third-order','Wronskian test','s',
