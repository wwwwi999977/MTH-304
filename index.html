const EZ={
'First-order equation (order)':r`Look at the derivative in the equation. If it is only \(\frac{dy}{dx}\) (one derivative, not a derivative of a derivative), the equation is first-order. Every equation in these PDFs looks like that.`,
'Separable equation':r`Think of sorting laundry: can you put everything with x in one pile and everything with y in another? If the right side is (something with only x) times (something with only y), it is separable. If x and y are joined by a plus sign, like \(y+\sin x\), you cannot split them, so it is not separable.`,
'Initial-value problem (IVP)':r`The equation alone gives many possible answers (a whole family of curves). The initial condition, like \(y(0)=3\), is a starting point that tells you which one curve you want. So: solve first, then use the starting point to find c.`,
'General solution and family of solutions':r`After integrating, your formula still has a leftover letter c. Think of c as a dial: every setting gives a different curve, and each one solves the equation. The formula with c is the general solution, and all its curves together are the family.`,
'Explicit and implicit solutions':r`Explicit: y is alone on one side, \(y=\ldots\), so you can read y directly. Implicit: x and y are still mixed together in one equation and you leave it that way. In Example 5 the PDF leaves the answer in this mixed form.`,
'Linear, homogeneous and other classifications':r`These words are not taught in this PDF, so skip them for now. Linear equations are the topic of Chapter 2 in this guide.`,
'Linear equation (in y)':r`A linear equation has this simple pattern: (something with x) times \(\frac{dy}{dx}\), plus (something with x) times y, equals (something with x). If you can arrange your equation into that pattern, it is linear.`,
'Standard form':r`Standard form is the clean way to write a linear equation: \(\frac{dy}{dx}\) has nothing in front of it, then \(+P(x)\,y\), then \(=f(x)\). If something is in front of \(\frac{dy}{dx}\), divide the whole equation by it. Then P(x) is what multiplies y, and f(x) is the right side.`,
'Linear and separable together':r`These are two different questions: "Is it linear?" and "Is it separable?". The PDF shows equations that are both (\(\frac{dy}{dx}+2xy=0\) and \(\frac{dy}{dx}=y+5\)) and one that is linear but not separable (\(\frac{dy}{dx}+y=x\)).`,
'Integrating factor':r`It is a helper you multiply the whole equation by. It is chosen so the left side collapses into one derivative, \(\frac{d}{dx}[\text{factor}\cdot y]\), and then you just integrate. To build it: take P(x), integrate it (no +c needed), and put the result on top of e, giving \(e^{\int P(x)dx}\).`,
'General solution and initial-value problem':r`General solution: the answer with c, many curves. IVP: the same equation plus a starting point that fixes c. In Example 5 the general answer is \(y=x-1+ce^{-x}\), and \(y(0)=4\) gives \(c=5\).`,
'Homogeneous and non-homogeneous':r`The PDF never uses these words, so there is nothing to learn about them from this file.`,
'Separation of variables':r`The idea: x-stuff goes with dx, y-stuff goes with dy. Recipe: (1) move everything with y (and dy) to one side and everything with x (and dx) to the other, (2) integrate each side by itself, (3) add one c, (4) if you can, get y alone.`,
'Solving an initial-value problem by separation':r`Solve the equation the normal way and keep the c. Then put the starting values (the x and y from the initial condition) into the answer and solve the small equation for c. Put that c back. In Example 4(b), \(y(0)=3\) gave \(c=9\).`,
'Integrating-factor method (linear first-order equations)':r`The idea: multiply by a special helper so the left side becomes a single derivative that integration can undo. Recipe: (1) make \(\frac{dy}{dx}\) stand alone (divide by whatever is in front), (2) read P(x), (3) build the helper \(e^{\int P(x)dx}\), (4) multiply the whole equation by it, so the left side becomes \(\frac{d}{dx}[\text{helper}\cdot y]\), (5) integrate both sides and add c, (6) solve for y.`,
'Separation of variables (when the linear equation is also separable)':r`Some linear equations can also be solved with the sorting trick from Chapter 1. The PDF mentions this for Example 1, then uses the integrating factor anyway. If the equation is not separable (like \(\frac{dy}{dx}+y=x\)), use the integrating factor.`,
'Solving an initial-value problem with the integrating factor':r`First get the general answer with c. Then put the starting values into it and solve for c. In Example 5, \(y(0)=4\) gives \(c=5\).`,
'Example 2: Solution Curve':r`Put y with dy and x with dx, then integrate both sides. The answer is circles around the origin, and the starting point (4, −3) picks the one with radius 5, because 16 + 9 = 25.`,
'Example 3: An Initial-Value Problem':r`Divide so the y-stuff sits with dy and the x-stuff with dx. Tidy each side first (split the fraction on the left, use \(\sin 2x=2\sin x\cos x\) on the right), then integrate. The starting point gives c = 4.`,
'Example 4(a): a family of solutions':r`y² goes with dy and the x-polynomial goes with dx. Integrate both sides, then take the cube root to get y. The leftover c makes a family of solutions.`,
'Example 4(b): Solving an initial value problem':r`Reuse the answer from 4(a). Put x = 0 and y = 3 into it: \(3=\sqrt[3]{3c}\), so c = 9.`,
'Example 5: an implicit solution':r`Same sorting trick. The PDF stops at the implicit form. The starting point (x = 0, y = π) gives \(c=5e^{\pi}-1\).`,
'Example 1: Solving a Linear Equation':r`Already clean: nothing is in front of \(\frac{dy}{dx}\). P = −3, so the helper is \(e^{-3x}\). Multiply, and the left side collapses to \(\frac{d}{dx}[e^{-3x}y]\). The right side is 0, so integrating gives \(e^{-3x}y=c\).`,
'Example 2: Solving a Linear Equation':r`Same left side as Example 1, so the same helper \(e^{-3x}\). The right side is now 6, so it becomes \(6e^{-3x}\) and must be integrated too. That extra integral produces the −2.`,
'Example 3: General Solution':r`There is an x in front of \(\frac{dy}{dx}\), so divide by x first. Then \(P=-4/x\) and the helper is \(x^{-4}\). Multiply, integrate (by parts), and solve for y.`,
'Example 4: General Solution':r`Divide by \(x^2-9\) to clean up. The helper is \(\sqrt{x^2-9}\). The left side collapses to one derivative and the right side is 0, so \(\sqrt{x^2-9}\,y=c\).`,
'Example 5: An Initial-Value Problem':r`Already clean, with P = 1, so the helper is \(e^{x}\). Get the general answer with c, then \(y(0)=4\) gives c = 5.`,
'Example 6: Solve the Linear ODE':r`Already clean, with \(P=\frac1x\), so the helper is x. Multiply, integrate, and divide by x: \(y=\frac1x\int x\cdot4x^2dx\).`,
'Example 7: Solve the Linear ODE':r`Not clean yet: divide by \(\sin x\) and re-order so \(\frac{dy}{dx}\) stands alone. Then \(P=\cot x\), the helper is \(\sin x\), and inside the integral \(\sin x\cdot\frac{1}{\sin x}\) is just 1.`

Object.assign(AZ,{
'First-order equation (order)':r`انظر إلى المشتقة في المعادلة. إذا كانت فقط \(\frac{dy}{dx}\) (مشتقة واحدة، وليست مشتقة لمشتقة) فالمعادلة من الرتبة الأولى (first-order). كل المعادلات في هذه الملفات من هذا النوع.`,
'Separable equation':r`تخيّل أنك تفرز الغسيل: هل تستطيع وضع كل ما فيه x في كومة وكل ما فيه y في كومة أخرى؟ إذا كان الطرف الأيمن (شيئاً فيه x فقط) مضروباً في (شيء فيه y فقط) فالمعادلة قابلة للفصل (separable). أما إذا كان x و y مربوطين بعلامة جمع مثل \(y+\sin x\) فلا يمكن فصلهما، والمعادلة غير قابلة للفصل.`,
'Initial-value problem (IVP)':r`المعادلة وحدها تعطي إجابات كثيرة (عائلة كاملة من المنحنيات). الشرط الابتدائي مثل \(y(0)=3\) هو نقطة البداية التي تحدد لك منحنى واحداً فقط. إذن: احلّ أولاً، ثم استخدم نقطة البداية لإيجاد c.`,
'General solution and family of solutions':r`بعد التكامل يبقى في الصيغة حرف زائد هو c. تخيّل c كمقبض: كل قيمة له تعطي منحنى مختلفاً، وكل المنحنيات تحلّ المعادلة. الصيغة التي فيها c هي الحل العام (general solution)، وكل منحنياتها معاً هي العائلة.`,
'Explicit and implicit solutions':r`الحل الصريح (explicit): y وحدها في طرف، \(y=\ldots\)، فتقرأ y مباشرة. الحل الضمني (implicit): x و y ما زالتا مختلطتين في معادلة واحدة وتتركها هكذا. في المثال 5 يترك الملف الجواب بهذه الصورة المختلطة.`,
'Linear, homogeneous and other classifications':r`هذه المصطلحات لا تُشرح في هذا الملف، فتجاوزها الآن. المعادلات الخطية موضوع الفصل 2 في هذا الدليل.`,
'Linear equation (in y)':r`المعادلة الخطية (linear) لها نمط بسيط: (شيء فيه x) مضروب في \(\frac{dy}{dx}\)، زائد (شيء فيه x) مضروب في y، يساوي (شيئاً فيه x). إذا استطعت ترتيب معادلتك على هذا النمط فهي خطية.`,
'Standard form':r`الصيغة القياسية (standard form) هي الطريقة النظيفة لكتابة المعادلة الخطية: لا شيء أمام \(\frac{dy}{dx}\)، ثم \(+P(x)\,y\)، ثم \(=f(x)\). إذا كان أمام \(\frac{dy}{dx}\) شيء، اقسم المعادلة كلها عليه. بعدها P(x) هو ما يضرب y، و f(x) هو الطرف الأيمن.`,
'Linear and separable together':r`هذان سؤالان مختلفان: «هل هي خطية؟» و«هل هي قابلة للفصل؟». يعرض الملف معادلات تجمع الصفتين (\(\frac{dy}{dx}+2xy=0\) و \(\frac{dy}{dx}=y+5\)) ومعادلة خطية لكنها غير قابلة للفصل (\(\frac{dy}{dx}+y=x\)).`,
'Integrating factor':r`عامل التكامل (integrating factor) مساعد تضرب فيه المعادلة كلها. يُختار بحيث يتحول الطرف الأيسر إلى مشتقة واحدة \(\frac{d}{dx}[\text{factor}\cdot y]\)، ثم تكتفي بالتكامل. لبنائه: خذ P(x)، كامله (بدون +c)، وضع الناتج أسّاً لـ e فتحصل على \(e^{\int P(x)dx}\).`,
'General solution and initial-value problem':r`الحل العام: الجواب الذي فيه c، أي منحنيات كثيرة. مسألة القيمة الابتدائية (IVP): المعادلة نفسها مع نقطة بداية تحدد c. في المثال 5 الحل العام \(y=x-1+ce^{-x}\)، والشرط \(y(0)=4\) يعطي \(c=5\).`,
'Homogeneous and non-homogeneous':r`لا يستخدم الملف هاتين الكلمتين، فلا يوجد ما تتعلمه عنهما من هذا الملف.`,
'Separation of variables':r`الفكرة: كل ما فيه x يذهب مع dx، وكل ما فيه y يذهب مع dy. الخطوات: (1) انقل كل ما فيه y (و dy) إلى طرف وكل ما فيه x (و dx) إلى الطرف الآخر، (2) كامل كل طرف وحده، (3) أضف c واحداً، (4) إن أمكن اجعل y وحدها.`,
'Solving an initial-value problem by separation':r`احلّ المعادلة بالطريقة المعتادة واحتفظ بـ c. ثم عوّض بقيم البداية (x و y من الشرط الابتدائي) في الجواب واحلّ المعادلة الصغيرة لإيجاد c. أعد c إلى الحل. في المثال 4(b) أعطى \(y(0)=3\) القيمة \(c=9\).`,
'Integrating-factor method (linear first-order equations)':r`الفكرة: اضرب في «مساعد» خاص فيصير الطرف الأيسر مشتقة واحدة يستطيع التكامل إلغاءها. الخطوات: (1) اجعل dy/dx وحدها (اقسم على ما أمامها)، (2) اقرأ P(x)، (3) ابنِ المساعد \(e^{\int P(x)dx}\)، (4) اضرب المعادلة كلها فيه فيصير الطرف الأيسر \(\frac{d}{dx}[\text{helper}\cdot y]\)، (5) كامل الطرفين وأضف c، (6) اجعل y وحدها.`,
'Separation of variables (when the linear equation is also separable)':r`بعض المعادلات الخطية يمكن حلها أيضاً بحيلة الفرز من الفصل 1. يذكر الملف ذلك في المثال 1 ثم يستخدم عامل التكامل على أي حال. إذا كانت المعادلة غير قابلة للفصل (مثل \(\frac{dy}{dx}+y=x\)) فاستخدم عامل التكامل.`,
'Solving an initial-value problem with the integrating factor':r`احصل أولاً على الحل العام وفيه c. ثم عوّض بقيم البداية واحلّ لإيجاد c. في المثال 5 الشرط \(y(0)=4\) يعطي \(c=5\).`,
'Differential form M dx + N dy = 0':r`بعد أن يصير الطرف الأيمن صفراً، M هي ما يضرب dx و N هي ما يضرب dy.`,
'Differential of a function of two variables':r`فكّر في f(x,y) = c على أنه الجواب الذي تريده. اشتقاقه يعطي معادلة على صورة M dx + N dy = 0. المعادلة التامة هي التي تستطيع فيها أن تسير في الاتجاه المعاكس.`,
'Exact equation':r`«تامة» (exact) تعني أن هناك دالة مخفية f(x,y). إذا وُجدت تستطيع إيجادها، والجواب هو f(x,y) = c.`,
'Test for exactness (Theorem 2.4.1)':r`اشتق جزء dx بالنسبة إلى y، واشتق جزء dy بالنسبة إلى x. إذا تساويا فالمعادلة تامة.`,
'Implicit solution f(x,y) = c':r`لا يلزمك استخراج y. كل قيمة لـ c تعطي منحنى مختلفاً f(x,y) = c.`,
'Other classifications (linear, homogeneous)':r`تجاوز هذه الكلمات هنا؛ التمام (exactness) اختبار قائم بذاته.`,
'Test for exactness':r`اشتق M بالنسبة إلى y و N بالنسبة إلى x. إذا خرجت النتيجتان متساويتين فالمعادلة تامة.`,
'Solving an exact equation (partial integration)':r`أعد بناء الدالة المخفية: كامل M بالنسبة إلى x، أضف دالة مجهولة g(y)، ثم استخدم N لإيجاد g(y). الجواب هو f(x,y) = c.`,
'Shortcut: integrate M and N, combine without repeats':r`كامل M بالنسبة إلى x، وكامل N بالنسبة إلى y، ثم ادمج النتيجتين مع كتابة كل حد مرة واحدة فقط.`,
'Substitution':r`استبدل الجزء المزعج بحرف جديد u فتتحول المعادلة إلى نوع تعرف حله، ثم أعد التعويض في النهاية.`,
'Bernoulli equation':r`معادلة برنولي (Bernoulli) معادلة خطية مع قوة إضافية لـ y في الطرف الأيمن. هذه القوة n تحدد لك التعويض.`,
'The Bernoulli substitution u = y^(1−n)':r`اطرح n من 1 واستخدم الناتج أساً جديداً لـ y.`,
'Linear equation after the substitution':r`بعد الاستبدال تحصل على معادلة مثل معادلات القسم 2.3، لكن بحرف u بدل y.`,
'Other classifications':r`في هذا الملف تُصنَّف معادلات برنولي فقط.`,
'Substitution (general idea)':r`استبدل الجزء المزعج بـ u، احلّ المعادلة الأسهل لإيجاد u، ثم أعد u لتحصل على y.`,
'Solving a Bernoulli equation':r`جد n، ثم ضع u = y^(1−n) فتتحول المعادلة إلى خطية. احلّها لإيجاد u، ثم ارجع إلى y.`,
'Second-order equation (order)':r`عُدّ الشرطات على y. شرطتان (y″) ولا شيء أعلى منهما تعني معادلة من الرتبة الثانية.`,
'Homogeneous linear with constant coefficients':r`أعداد عادية أمام y″ و y′ و y، وصفر في الطرف الأيمن. هذا هو النوع الوحيد الذي يحله هذا الفصل.`,
'Auxiliary equation':r`استبدل y″ بـ m² و y′ بـ m و y بـ 1، فتحصل على معادلة تربيعية عادية (المعادلة المساعدة).`,
'The three cases for the roots':r`إما جذران حقيقيان مختلفان، أو جذر مكرر، أو زوج فيه i. أيٌّ منها تحصل عليه يحدد الصيغة.`,
'Second-order initial-value problem':r`ثابتان يحتاجان إلى معلومتين. مسألة القيمة الابتدائية تعطيهما: القيمة عند البداية والميل عند البداية.`,
'Boundary-value problem (Problems 37–40)':r`يعرض الملف هذه المسائل كتمارين بلا مثال محلول، لذلك تُعرض هنا المسائل فقط.`,
'Auxiliary-equation method':r`خمّن y = e^(mx) وعوّض، فتتحول المعادلة إلى معادلة تربيعية في m. الجذور تحدد الجواب.`,
'Solving a second-order initial-value problem':r`احلّ أولاً حلاً عاماً. ثم استخدم القيمة والميل عند البداية لتحديد C₁ و C₂.`,
'Homogeneous linear second-order equation':r`معادلة فيها y″ و y′ و y، لكل منها معامل (قد يعتمد على x)، وصفر في الطرف الأيمن.`,
'Standard form y″ + P(x)y′ + Q(x)y = 0':r`اقسم حتى تبقى y″ وحدها بمعامل 1. بعدها اقرأ P(x)، وهو العدد أو الدالة أمام y′.`,
'A given solution y₁':r`يُعطى لك حل واحد صحيح. الطريقة تبني منه حلاً ثانياً.`,
'Linearly independent solutions y₁, y₂':r`y₁ و y₂ حلان مختلفان فعلاً، وليس أحدهما نسخة من الآخر (مستقلان خطياً).`,
'General solution y = C₁y₁ + C₂y₂':r`اجمع حليك، لكل منهما ثابته الخاص.`,
'Reduction of order (finding y₂ from a given y₁)':r`يُعطى لك حل واحد. تعطيك الصيغة حلاً ثانياً مختلفاً. اجمعهما بثابتين.`,
'Linear initial-value problem (nth order)':r`المعادلة مع معلومات عن نقطة بداية واحدة.`,
'Existence and uniqueness (Theorem 4.1.1)':r`فحص أمان يخبرك متى يكون لمسألة القيمة الابتدائية جواب واحد فقط.`,
'Boundary-value problem (BVP)':r`معلومات عن مكانين مختلفين بدل مكان واحد. قد يكون للمسألة حلول كثيرة أو حل واحد أو لا حل.`,
'Homogeneous and nonhomogeneous':r`صفر في الطرف الأيمن يعني متجانسة (homogeneous). أي شيء آخر في الطرف الأيمن يعني غير متجانسة (nonhomogeneous).`,
'Differential operator D':r`D اختصار لعبارة «خذ المشتقة». هو فقط يختصر الكتابة.`,
'Superposition principle (Theorem 4.1.2)':r`اجمع الحلول واضربها في أعداد، فتبقى النتيجة حلاً (مبدأ التراكب).`,
'Linear dependence and independence (Definition 4.1.1)':r`معتمدة (dependent): يمكن بناء إحدى الدوال من الباقي. مستقلة (independent): كل دالة تضيف شيئاً جديداً.`,
'Wronskian and fundamental set':r`اختبار واحد: إذا لم تكن W صفراً فالحلول مختلفة فعلاً (الرونسكيان Wronskian).`,
'General solution and complementary function':r`جواب المعادلة غير المتجانسة = (الحل العام للجزء المتجانس) + (حل خاص واحد).`,
'Wronskian test and general solution (homogeneous)':r`ضع الحلول في محدد. إذا لم يكن صفراً فهي مختلفة فعلاً، فاجمعها بثوابت.`,
'Nonhomogeneous equation: complementary function plus particular solution':r`احلّ النسخة التي طرفها الأيمن 0، ثم أضف حلاً صحيحاً واحداً للطرف الأيمن الحقيقي.`,
'Existence check and boundary conditions':r`افحص الضمان أولاً. وللشروط الحدّية عوّضها في الحل العام وانظر كم جواباً يبقى.`

Object.assign(AZ,{
'Example 2: Solution Curve':r`ضع y مع dy و x مع dx ثم كامل الطرفين. الجواب دوائر مركزها نقطة الأصل، ونقطة البداية (4, −3) تختار الدائرة ذات نصف القطر 5 لأن 16 + 9 = 25.`,
'Example 3: An Initial-Value Problem':r`اقسم حتى يصير ما فيه y مع dy وما فيه x مع dx. رتّب كل طرف أولاً (جزّئ الكسر في اليسار، واستخدم \(\sin 2x=2\sin x\cos x\) في اليمين) ثم كامل. نقطة البداية تعطي c = 4.`,
'Example 4(a): a family of solutions':r`y² تذهب مع dy وكثيرة الحدود في x تذهب مع dx. كامل الطرفين ثم خذ الجذر التكعيبي لتحصل على y. الثابت c المتبقي يصنع عائلة من الحلول.`,
'Example 4(b): Solving an initial value problem':r`أعد استخدام جواب 4(a). ضع x = 0 و y = 3 فيه: \(3=\sqrt[3]{3c}\)، إذن c = 9.`,
'Example 5: an implicit solution':r`الحيلة نفسها: افصل وكامل. يتوقف الملف عند الصورة الضمنية. نقطة البداية (x = 0, y = π) تعطي \(c=5e^{\pi}-1\).`,
'Example 1: Solving a Linear Equation':r`المعادلة نظيفة أصلاً: لا شيء أمام \(\frac{dy}{dx}\). P = −3 فالمساعد هو \(e^{-3x}\). اضرب فيتحول الطرف الأيسر إلى \(\frac{d}{dx}[e^{-3x}y]\). الطرف الأيمن 0 فالتكامل يعطي \(e^{-3x}y=c\).`,
'Example 2: Solving a Linear Equation':r`الطرف الأيسر نفسه في المثال 1 فالمساعد نفسه \(e^{-3x}\). الطرف الأيمن الآن 6 فيصبح \(6e^{-3x}\) ويجب تكامله أيضاً. هذا التكامل الإضافي هو الذي يعطي −2.`,
'Example 3: General Solution':r`أمام \(\frac{dy}{dx}\) يوجد x، فاقسم على x أولاً. عندها \(P=-4/x\) والمساعد \(x^{-4}\). اضرب، كامل (بالتجزئة)، ثم اجعل y وحدها.`,
'Example 4: General Solution':r`اقسم على \(x^2-9\) لتنظّف المعادلة. المساعد \(\sqrt{x^2-9}\). الطرف الأيسر يصير مشتقة واحدة والأيمن 0، فيكون \(\sqrt{x^2-9}\,y=c\).`,
'Example 5: An Initial-Value Problem':r`المعادلة نظيفة وفيها P = 1 فالمساعد \(e^{x}\). احصل على الحل العام وفيه c، ثم \(y(0)=4\) يعطي c = 5.`,
'Example 6: Solve the Linear ODE':r`المعادلة نظيفة وفيها \(P=\frac1x\) فالمساعد x. اضرب، كامل، واقسم على x: \(y=\frac1x\int x\cdot4x^2dx\).`,
'Example 7: Solve the Linear ODE':r`ليست نظيفة بعد: اقسم على \(\sin x\) ورتّب حتى تبقى \(\frac{dy}{dx}\) وحدها. عندها \(P=\cot x\) والمساعد \(\sin x\)، وداخل التكامل \(\sin x\cdot\frac{1}{\sin x}\) يساوي 1 فقط.`,
'Introduction example':r`لاحظ أن الطرف الأيسر هو بالضبط تفاضل xy. هذه هي فكرة هذا القسم كله.`,
'Example 1(a)':r`M لا فيها y و N لا فيها x، فالمشتقتان 0 وتتساويان.`,
'Example 1(b)':r`المشتقتان 1 و −1. مختلفتان، فيفشل الاختبار.`,
'Example 1(c)':r`المشتقتان تخرجان \(\cos y-\sin x\) كلتاهما، فتنجح المعادلة في الاختبار.`,
'Example 1(d)':r`المشتقتان 2y كلتاهما، فتنجح المعادلة في الاختبار.`,
'Example 2: Solving an Exact DE':r`كامل \(2xy\) بالنسبة إلى x فتحصل على \(x^2y\) زائد دالة مجهولة \(g(y)\)؛ ومقارنتها بـ \(x^2-1\) تبين أن \(g(y)=-y\).`,
'Example 3: Solving an Exact DE':r`تكامل M يترك كل شيء ما عدا جزءاً فيه y فقط. المقارنة مع N تبين أن الجزء الناقص هو y.`,
'Example 4: Solving an Exact DE':r`انقل كل شيء إلى طرف واحد لتجد M و N، ثم اتبع الروتين نفسه: كامل M بالنسبة إلى x وحدد جزء y باستخدام N.`,
'Example 5: Solving an IVP':r`احلّ المعادلة التامة لتحصل على f = C، ثم ضع x = 0 و y = 3 لتحدد C = 18.`,
'Exercise 1 (Exercises 2.4)':r`تحقق أن 4 = 4، كامل \(5x+4y\) بالنسبة إلى x، ثم حدد جزء y باستخدام \(4x-8y^3\) لتحصل على \(-2y^4\).`,
'Example 1(a): convert to linear':r`هنا n = 2 فيكون \(v=y^{-1}\). التعويض يحوّل y² إلى v عادية ويترك معادلة خطية.`,
'Example 1(b): convert to linear':r`بما أن n = −2 فإن 1 − n = 3 فيكون \(v=y^3\). اضرب في 3 لتتخلص من الكسر 1/3.`,
'Example 1(c): convert to linear':r`n = 4 تعطي \(v=y^{-3}\). اقسم على y⁴ أولاً ليصير الطرف الأيمن x فقط، ثم عوّض.`,
'Example 1(d): convert to linear':r`انقل الجذر إلى اليمين على صورة \(y^{1/2}\) فتكون n = 1/2 و \(v=y^{1/2}\).`,
'Example 2: Solving a Bernoulli DE':r`اقسم على x، وضع u = 1/y، احلّ المعادلة الخطية لإيجاد u، ثم اقلب راجعاً: y = 1/u.`,
'Example 3: Solving a Bernoulli DE':r`اضرب الطرف الأيمن لترى y⁴ (أي n = 4) فيكون \(u=y^{-3}\). المعادلة الخطية تُحل بالمساعد \(e^{-3x}\).`,

'Example 1(a): Second-Order DEs':r`جذران حقيقيان مختلفان، فلكل جذر دالة أسّية.`,

'Example 2(b): An Initial-Value Problem':r`جذران حقيقيان يعطيان دالتين أسّيتين. والشرطان يصيران معادلتين بسيطتين في C₁ و C₂.`,
'Example 3: An IVP (second order)':r`الجذور المركبة تعطي \(e^{-x/2}\) في cos و sin. استخدم y(0) لإيجاد c₁، ثم اشتق لإيجاد c₂.`,
'Example 1 (reduction of order)':r`اقسم على x² أولاً. عندها \(P=-3/x\) وتعطي الصيغة الحل الإضافي \(x^2\ln x\).`,
'Example 2 (reduction of order)':r`P = 0 فيكون الأسّ في الصيغة 1 فقط. والتكامل يعطي \(e^{-x}\) مع ثابت.`,
'Example 3 (reduction of order)':r`مع \(y_1=1\) تصير الصيغة مجرد تكامل \(e^{-x}\). الحل الثاني \(e^{-x}\) مع تجاهل الإشارة.`,
'Example 4 (reduction of order)':r`تكامل \(1/\cos^2\) هو ظل (tan). الضرب في cos يعطي جيباً (sin). الثابت 1/4 مجرد ثابت فيُحذف.`,
'Example 5 (reduction of order)':r`\(e^{-2x}\) تختصر مع مربع \(xe^{-x}\) فيبقى \(1/x^2\). التكامل يعطي \(-1/x\)، والضرب في \(xe^{-x}\) يترك \(e^{-x}\).`,
'Example 1 (unique solution of an IVP)':r`كل شروط النظرية متحققة، فالجواب مضمون أن يكون الوحيد.`,

'Example 2(a): A BVP can have many, one, or no solutions':r`الشرط الثاني يتحقق تلقائياً، فيبقى c₂ حراً. وهذا يعطي عدداً لا نهائياً من الحلول.`,
'Example 2(b)':r`هذه المرة الشرط الثاني يفرض c₂ = 0.`,

'Example 1 (differential operators), part (b)':r`الفكرة نفسها؛ والعبارة 3x في الطرف الأيمن تجعلها غير متجانسة.`,
'Example 2 (superposition)':r`يمكن جمع حلين لمعادلة متجانسة مع ضربهما في ثوابت.`,
'Example 3 (superposition)':r`أي مضاعف ثابت أو مجموع للحلين هو حل أيضاً، بما في ذلك 0.`,
'Example 4: Linearly Dependent Set of Functions':r`متطابقتان تلغيان كل شيء بهذه الثوابت، فالمجموعة معتمدة خطياً.`,
'Example 5: Linearly Dependent Set of Functions':r`f₂ مبنية من f₁ و f₃، فالمجموعة معتمدة خطياً.`,

'Example 6':r`المحدد −6 وليس صفراً، فالدالتان مستقلتان ويمكن جمعهما.`,
'Example 7':r`ثلاث دوال لمعادلة من الرتبة الثالثة، والمحدد 2 (ليس صفراً)، فهي مجموعة أساسية.`,
'Example 8':r`يتبسط المحدد إلى 4 باستخدام \(\cos^2+\sin^2=1\).`,
'Example 9: General Solution of a Homogeneous DE':r`المحدد \(2e^{6x}\) ولا يساوي صفراً أبداً، فالحلول الثلاثة مستقلة.`,
'Example 10: General Solution of a Nonhomogeneous DE':r`خذ جواب النسخة ذات الطرف الأيمن الصفري (المثال 9) وأضف الحل الخاص المعطى.`
